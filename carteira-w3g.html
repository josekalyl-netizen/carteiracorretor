  html += repNum(atv.falei, 'Falei');
  html += repNum(atv.nao, 'Não falei');
  html += repNum(atv.reativacao, 'Reativações');
  html += repNum(atv.corretores, 'Corretores contatados');
  html += repNum(atv.dias, 'Dias com contato');

  }
  html += '</div>';

  // relatorio por periodo
  html += '<div class="card">';
  html += '<div class="sect-title"><i class="ti ti-report"></i>Relatório por período</div>';
  html += '<p class="hint" style="margin:0 0 1rem;">Escolha o intervalo (ex.: 01/06 a 30/06) ou use um atalho. Traz os corretores adicionados no período, com dados, status e todas as anotações.</p>';

  // atalhos
  html += '<div class="chips" style="margin-bottom:1rem;">';
  html += '<button class="chip" onclick="setRepRange(\'semana\')">Esta semana</button>';
  html += '<button class="chip" onclick="setRepRange(\'mes\')">Este mês</button>';
  html += '<button class="chip" onclick="setRepRange(\'7d\')">Últimos 7 dias</button>';
  html += '<button class="chip" onclick="setRepRange(\'30d\')">Últimos 30 dias</button>';
  html += '<button class="chip" onclick="setRepRange(\'tudo\')">Tudo</button>';
  html += '</div>';

  // datas manuais
  const sV = repStart ? repStart : '';
  const eV = repEnd ? repEnd : '';
  html += '<div style="display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:1rem;">';
  html += '<div><label>Data início</label><input type="date" id="rep-start" value="' + sV + '" onchange="repStart=this.value;buildRelatorio()"></div>';
  html += '<div><label>Data fim</label><input type="date" id="rep-end" value="' + eV + '" onchange="repEnd=this.value;buildRelatorio()"></div>';
  html += '</div>';

  // filtro flag
  html += '<div class="chips" style="margin-bottom:1.2rem;"><span class="hint" style="margin-right:2px;">Incluir:</span>';
  [['todos','Todos'],['no_show','Só No-show'],['star','Só estrela'],['moplan','Só Moplan']].forEach(f => {
    const cls = repFlag === f[0] ? (f[0]==='moplan'?'chip active-dados':'chip active') : 'chip';
    html += '<button class="' + cls + '" onclick="repFlag=\'' + f[0] + '\';buildRelatorio()">' + f[1] + '</button>';
  });
  html += '</div>';

  // calcular lista do periodo
  const list = reportList();
  const nums = reportNums(list);

  // resumo (topo)
  html += '<div style="padding:1rem 1.2rem; background:rgb(var(--c-paper) / 0.5); border:1px solid rgb(var(--c-line)); border-radius:12px; margin-bottom:1rem;">';
  html += '<div style="font-size:12px; color:rgb(var(--c-muted)); margin-bottom:10px;">' + (repStart && repEnd ? 'Período: ' + fmtDate(repStart) + ' a ' + fmtDate(repEnd) : 'Selecione um período ou atalho') + '</div>';
  html += '<div style="display:grid; grid-template-columns:repeat(auto-fit,minmax(110px,1fr)); gap:14px;">';
  html += repNum(list.length, 'Adicionados');

  html += repNum(nums.notas, 'Anotações');
  html += '</div>';
  html += '<div style="height:1px; background:rgb(var(--c-line)); margin:12px 0;"></div>';
  html += '<div style="display:grid; grid-template-columns:repeat(auto-fit,minmax(110px,1fr)); gap:14px;">';
  html += repNum(nums.no_show, 'No-show');
  html += repNum(nums.sem_codigo, 'Sem código');
  html += repNum(nums.solicitado, 'Cód. solicitado');
  html += repNum(nums.aberto, 'Cód. aberto');
  html += repNum(nums.proposta, 'Com proposta');
  html += repNum(nums.engajado, 'Engajados');
  html += '</div>';
  html += '</div>';

  // botoes gerar

function repNum(n, label) {

}
function reportList() {
  let list = ativos();
  if (repStart) { const s = new Date(repStart + 'T00:00:00'); list = list.filter(c => new Date(c.createdAt) >= s); }
  if (repEnd) { const e = new Date(repEnd + 'T23:59:59'); list = list.filter(c => new Date(c.createdAt) <= e); }
  if (repFlag === 'star') list = list.filter(isStar);
  else if (repFlag === 'moplan') list = list.filter(c => c.moplan);
  else if (repFlag === 'no_show') list = list.filter(c => c.stage === 'no_show');
  return list.sort((a,b) => new Date(a.createdAt) - new Date(b.createdAt));
}
// atividade no período do relatório: lê o registro de contatos e as notas de mudança de etapa
function atividadePeriodo() {
  const ini = repStart ? dayNum(parseData(repStart)) : -Infinity;
  const fim = repEnd ? dayNum(parseData(repEnd)) : Infinity;
  const dentro = d => { const n = dayNum(d); return n >= ini && n <= fim; };
  const r = { falei: 0, nao: 0, reativacao: 0, corretores: 0, dias: 0, avancos: 0, recuos: 0, destino: {} };
  const dias = new Set();
  data.corretores.forEach(c => {
    let contatado = false;
    (c.contatoLog || []).forEach(x => {
      if (!dentro(x.date)) return;
      if (x.resultado === 'falei') { r.falei++; contatado = true; dias.add(dayNum(x.date)); }
      else if (x.resultado === 'nao') r.nao++;
      else if (x.resultado === 'reativacao') { r.reativacao++; contatado = true; dias.add(dayNum(x.date)); }
    });
    if (contatado) r.corretores++;
    (c.notas || []).forEach(n => {
      if (!dentro(n.date)) return;
      const m = /^Etapa: (avançou|voltou) de ".*?" para "(.*?)"/.exec(n.text || '');
      if (!m) return;
      if (m[1] === 'avançou') { r.avancos++; r.destino[m[2]] = (r.destino[m[2]] || 0) + 1; }
      else r.recuos++;
    });
  });
  r.dias = dias.size;
  return r;
}
function reportNums(list) {
  return {
    star: list.filter(isStar).length,
    moplan: list.filter(c => c.moplan).length,
    notas: list.reduce((s,c) => s + c.notas.length, 0),
    no_show: list.filter(c => c.stage === 'no_show').length,
    sem_codigo: list.filter(c => c.stage === 'sem_codigo').length,
    solicitado: list.filter(c => c.stage === 'solicitado').length,
    aberto: list.filter(c => c.stage === 'aberto').length,
    proposta: list.filter(c => c.stage === 'proposta').length,
    engajado: list.filter(c => c.stage === 'engajado').length
  };
}

// cache das mensagens sugeridas no render atual do follow-up (id -> {msgBase, tema})
let msgCache = {};

// Desfaz a marcação de HOJE (Falei / Não falei) por inteiro: tira o registro do
// log, devolve o passo da jornada e libera de novo a mensagem/fechamento usados.
// Sem isso, um clique duplo sem querer fazia o corretor pular um contato.
function desfazerHoje(c) {
  const u = c._undo;
  if (!u) return false;
  ensureJornada(c);
  for (let i = c.contatoLog.length - 1; i >= 0; i--) {
    if (c.contatoLog[i].date === u.logDate) { c.contatoLog.splice(i, 1); break; }
  }
  if (u.tipo === 'falei') {
    c.lastContact = u.lastContact;
    c.missedYesterday = u.missed;
    if (c.jornada.etapaAtual === u.etapa) c.jornada.contato = u.contato;
    if (u.msg) { const i = c.msgHist.indexOf(u.msg); if (i >= 0) c.msgHist.splice(i, 1); }
    if (u.fech) { const i = c.fechHist.indexOf(u.fech); if (i >= 0) c.fechHist.splice(i, 1); }
  }
  c.lastResult = u.lastResult;
  delete c._undo;
  return true;
}
function markFalei(id) {
  const c = data.corretores.find(x => x.id === id); if (!c) return;
  if (c.status === 'falei') {
    // desmarcar: volta exatamente ao estado de antes do clique
    if (!desfazerHoje(c)) { c.lastContact = null; c.lastResult = null; }
    c.status = 'pendente';
  } else {
    if (c.status === 'nao') desfazerHoje(c);   // trocou "Não falei" por "Falei"
    ensureJornada(c);
    const cached = msgCache[id];
    const u = {
      tipo: 'falei', lastContact: c.lastContact, lastResult: c.lastResult, missed: c.missedYesterday,
      etapa: c.stage, contato: c.jornada.contato,
      msg: (cached && cached.msgBase && !c.msgHist.includes(cached.msgBase)) ? cached.msgBase : null,
      fech: (cached && cached.fechamento && !c.fechHist.includes(cached.fechamento)) ? cached.fechamento : null
    };
    c.status = 'falei'; c.lastContact = todayStr(); c.lastResult = 'falei'; c.missedYesterday = false;
    const t = (c._todayNote || '').trim();
    if (t) { c.notas.unshift({ date: now(), text: t, stage: c.stage }); c._todayNote = ''; }
    // avança a jornada: registra a mensagem usada (não repete mais) e sobe o contato
    registrarContato(c, 'falei', cached ? cached.msgBase : null, cached ? cached.tema : null, cached ? cached.fechamento : null);
    u.logDate = c.contatoLog[c.contatoLog.length - 1].date;
    c._undo = u;
  }
  saveData(); buildFollowup();
}
function markNao(id) {
  const c = data.corretores.find(x => x.id === id); if (!c) return;
  if (c.status === 'nao') {
    desfazerHoje(c);
    c.status = 'pendente';
  } else {
    if (c.status === 'falei') desfazerHoje(c);   // trocou "Falei" por "Não falei": devolve a jornada
    ensureJornada(c);
    const u = { tipo: 'nao', lastResult: c.lastResult };
    c.status = 'nao'; c.lastResult = 'nao';
    const t = (c._todayNote || '').trim();
    if (t) { c.notas.unshift({ date: now(), text: '[Não falei] ' + t, stage: c.stage }); c._todayNote = ''; }
    // "não falei" não consome a mensagem nem avança a jornada — só registra a tentativa
    u.logDate = now();
    c.contatoLog.push({ date: u.logDate, etapa: c.stage, contato: c.jornada.contato, tema: null, resultado: 'nao' });
    c.updatedAt = u.logDate;
    c._undo = u;
  }
  saveData(); buildFollowup();
}

/* ---------- REATIVAÇÃO (Leva 8) — para corretores parados há muito tempo ---------- */
const TEMAS_REATIVACAO = ['re_faz_tempo','re_antes_negocio','re_voltar_conversar','re_abrir_espaco','re_perguntas','re_reaproximar','re_futura'];
function gerarReativacao(id) {
  const c = data.corretores.find(x => x.id === id); if (!c) return;
  ensureJornada(c);
  // escolhe um tema de reativação que ainda tenha mensagem não usada por este corretor
  const disponiveis = TEMAS_REATIVACAO.filter(t => temMsgDisponivel(c, t));
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.style.alignItems = 'center';
  overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };

  if (disponiveis.length === 0) {
    overlay.innerHTML = '<div class="modal" style="max-width:420px;"><div style="padding:1.6rem;">' +
      '<div class="sect-title"><i class="ti ti-alert-triangle"></i>Reativação</div>' +
      '<p class="hint" style="margin:0 0 1rem;">As mensagens de reativação já foram todas usadas com este corretor. Escreva uma manualmente ou me peça novas variações.</p>' +
      '<button class="btn btn-sm" style="width:100%;" id="rt-close">Fechar</button></div></div>';
    document.body.appendChild(overlay);
    document.getElementById('rt-close').onclick = () => overlay.remove();
    return;
  }
  const tema = disponiveis[Math.floor(Math.random() * disponiveis.length)];
  const msgBase = escolherMensagem(c, tema);
  const texto = msgBase.replace(/\{nome\}/g, primeiroNome(c.name));

  overlay.innerHTML = '<div class="modal" style="max-width:460px;"><div style="padding:1.6rem;">' +
    '<div class="sect-title"><i class="ti ti-refresh-dot"></i>Mensagem de reativação</div>' +
    '<p class="hint" style="margin:0 0 0.9rem;">Para reaproximar um corretor parado há bastante tempo (90–180 dias). Reabre a conversa sem cobrança.</p>' +
    '<div class="jmsg" id="rt-msg" style="margin-bottom:0.9rem;">' + esc(texto) + '</div>' +
    '<div style="display:flex; gap:7px; flex-wrap:wrap;">' +
    '<button class="btn btn-sm btn-accent" id="rt-copy"><i class="ti ti-copy"></i> Copiar</button>' +
    '<button class="btn btn-sm" id="rt-outra"><i class="ti ti-refresh"></i> Outra</button>' +
    (c.dados.telefone ? '<button class="btn btn-sm" id="rt-whats"><i class="ti ti-brand-whatsapp"></i> WhatsApp</button>' : '') +
    '<button class="btn btn-sm" id="rt-usar" title="Marca como usada e registra no histórico"><i class="ti ti-check"></i> Registrar envio</button>' +
    '<button class="btn btn-sm btn-ghost" id="rt-close">Fechar</button>' +
    '</div></div></div>';
  document.body.appendChild(overlay);

  let atualBase = msgBase, atualTema = tema;
  document.getElementById('rt-close').onclick = () => overlay.remove();
  document.getElementById('rt-copy').onclick = () => {
    const t = document.getElementById('rt-msg').textContent;
    const ok = () => alert('Mensagem copiada!');
    if (navigator.clipboard) navigator.clipboard.writeText(t).then(ok, () => fallbackCopy(t, ok));
    else fallbackCopy(t, ok);
  };
  document.getElementById('rt-outra').onclick = () => {
    const disp = TEMAS_REATIVACAO.filter(t => temMsgDisponivel(c, t));
    if (!disp.length) return;
    const nt = disp[Math.floor(Math.random() * disp.length)];
    const nb = escolherMensagem(c, nt);
    if (!nb) return;
    atualBase = nb; atualTema = nt;
    document.getElementById('rt-msg').textContent = nb.replace(/\{nome\}/g, primeiroNome(c.name));
  };
  const wb = document.getElementById('rt-whats');
  if (wb) wb.onclick = () => {
    const t = document.getElementById('rt-msg').textContent;
    const fone = c.dados.telefone.replace(/\D/g, '');
    const num = fone.length <= 11 ? '55' + fone : fone;
    window.open('https://wa.me/' + num + '?text=' + encodeURIComponent(t), '_blank');
  };
  document.getElementById('rt-usar').onclick = () => {
    if (!c.msgHist.includes(atualBase)) c.msgHist.push(atualBase);
    c.notas.unshift({ date: now(), text: 'Reativação enviada: ' + atualBase.replace(/\{nome\}/g, primeiroNome(c.name)), stage: c.stage });
    c.contatoLog = c.contatoLog || [];
    c.contatoLog.push({ date: now(), etapa: c.stage, contato: null, tema: atualTema, resultado: 'reativacao' });
    c.updatedAt = now();
    saveData(); overlay.remove(); render(); if (openCardId === c.id) openCard(c.id);
  };
}

/* ---------- relatório: atalhos e geração ---------- */
function weekStartMonday(d) {
  const x = new Date(d); const day = x.getDay();
  x.setDate(x.getDate() + ((day === 0 ? -6 : 1) - day)); x.setHours(0,0,0,0); return x;
}
function setRepRange(kind) {
  const t = new Date();
  if (kind === 'semana') { repStart = isoLocal(weekStartMonday(t)); repEnd = isoLocal(t); }
  else if (kind === 'mes') { repStart = isoLocal(new Date(t.getFullYear(), t.getMonth(), 1)); repEnd = isoLocal(t); }
  else if (kind === '7d') { const s = new Date(t); s.setDate(s.getDate()-6); repStart = isoLocal(s); repEnd = isoLocal(t); }
  else if (kind === '30d') { const s = new Date(t); s.setDate(s.getDate()-29); repStart = isoLocal(s); repEnd = isoLocal(t); }
  else if (kind === 'tudo') { repStart = ''; repEnd = ''; }
  buildRelatorio();
}

      : '<li style="color:#888;">Sem anotações registradas.</li>';
    return '<div style="border:1px solid #dde3ec; border-radius:10px; padding:16px; margin-bottom:14px; page-break-inside:avoid;">' +

function exportBackup() {

// confere se o arquivo é mesmo um backup da carteira antes de aceitar
function backupValido(p) {
  return !!p && typeof p === 'object' && Array.isArray(p.corretores) &&
    p.corretores.every(c => c && typeof c === 'object' && typeof c.name === 'string');
}
function importBackup() {
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.json,application/json';
  inp.onchange = (e) => {
    const file = e.target.files[0]; if (!file) return;
    const r = new FileReader();
    r.onload = (ev) => {
      try {
        const parsed = JSON.parse(ev.target.result);
        if (backupValido(parsed)) {
          const nNovo = parsed.corretores.filter(c => !c.deleted).length;
          const nAtual = ativos().length;
          const quando = parsed.savedAt ? '\nSalvo em: ' + fmtDateTime(parsed.savedAt) : '';
          if (confirm('Restaurar este backup?\n\nArquivo: ' + file.name + quando + '\nCorretores ativos no backup: ' + nNovo + '\nCorretores ativos agora: ' + nAtual + '\n\nOs dados atuais serão substituídos (fica guardada uma cópia deles neste navegador, por segurança).')) {
            // guarda o estado atual antes de sobrescrever
            try { localStorage.setItem(STORAGE + '_antes_restaurar', JSON.stringify({ savedAt: now(), data: data })); } catch(e2) {}
            data = migrateLegacy(parsed);
            if (rolloverIfNeeded() === false) saveData();
            render();
            alert('Backup restaurado com sucesso! ' + nNovo + ' corretores ativos.');
          }
        } else alert('Arquivo inválido: não parece ser um backup da carteira.');
      } catch(err) { alert('Não consegui ler o arquivo.'); }
    };
    r.readAsText(file);
  };
  inp.click();
}

function nuvemPendente() { try { return localStorage.getItem(NUVEM_PEND) === '1'; } catch(e) { return false; } }

function nuvemRevLocal() { try { const v = localStorage.getItem(NUVEM_REV); return v === null ? null : Number(v); } catch(e) { return null; } }

// chamado a cada salvamento: marca como pendente e envia com um pequeno atraso
function nuvemAgendar() {
  if (!nuvemLigada()) return;
  nuvemMarcarPendente(true);
  if (!nuvemPronta) return;   // ainda sem login/carga: envia quando conectar
  nuvemStatus('ti-cloud-up', 'Enviando…');
  clearTimeout(nuvemTimer);
  nuvemTimer = setTimeout(nuvemEnviar, 1500);
}

async function nuvemEnviar() {
  if (!nuvemPronta || nuvemEnviando) return;
  nuvemEnviando = true;
  const enviadoEm = data.savedAt;
  let conflito = false;
  try {
    let res;
    if (nuvemRev === null) {
      res = await sb.from('carteira').insert({ user_id: nuvemUid, data: data, rev: 1 }).select('rev');
      if (res.error && res.error.code === '23505') { conflito = true; res = { data: [] }; }   // já existe (outro aparelho criou)
    } else {
      // só grava se a nuvem ainda está na versão que este aparelho conhece
      res = await sb.from('carteira').update({ data: data, rev: nuvemRev + 1, updated_at: new Date().toISOString() })
        .eq('user_id', nuvemUid).eq('rev', nuvemRev).select('rev');
    }
    if (res.error) throw res.error;
    if (!res.data || !res.data.length) conflito = true;
    if (!conflito) {
      nuvemDefinirRev(res.data[0].rev);
      if (data.savedAt === enviadoEm) { nuvemMarcarPendente(false); nuvemStatus('ti-cloud-check', 'Nuvem em dia', '--c-grow'); }
      nuvemSnapshot();
    }
  } catch (e) {
    nuvemStatus('ti-cloud-off', 'Sem nuvem · salvo neste aparelho', '--c-warn');
    clearTimeout(nuvemTimer);
    nuvemTimer = setTimeout(nuvemEnviar, 20000);   // tenta de novo
  }
  nuvemEnviando = false;
  if (conflito) { nuvemConflito(null); return; }
  if (nuvemPendente() && data.savedAt !== enviadoEm) { clearTimeout(nuvemTimer); nuvemTimer = setTimeout(nuvemEnviar, 800); }
}

// a nuvem tem uma versão diferente da que este aparelho conhecia: o usuário decide
async function nuvemConflito(row) {
  if (!row) {
    const r = await sb.from('carteira').select('data,rev').eq('user_id', nuvemUid).maybeSingle();
    if (r.error || !r.data) { nuvemStatus('ti-cloud-off', 'Erro na nuvem', '--c-alert'); return; }
    row = r.data;
  }
  const nNuvem = ((row.data && row.data.corretores) || []).filter(c => c && !c.deleted).length;
  const usarNuvem = confirm('A carteira foi alterada em outro aparelho e este aqui também tem alterações não enviadas.\n\n' +
    'Na nuvem: ' + nNuvem + ' corretores ativos' + (row.data && row.data.savedAt ? ' · salvo em ' + fmtDateTime(row.data.savedAt) : '') + '\n' +
    'Neste aparelho: ' + ativos().length + ' corretores ativos' + (data.savedAt ? ' · salvo em ' + fmtDateTime(data.savedAt) : '') + '\n\n' +
    'OK = ficar com a versão da NUVEM\nCancelar = manter a DESTE APARELHO e enviar para a nuvem');
  if (usarNuvem) { nuvemAdotar(row); render(); }
  else { nuvemDefinirRev(row.rev); nuvemAgendar(); }
}

// troca os dados da tela pelos da nuvem (guardando antes uma cópia do que havia aqui)
function nuvemAdotar(row) {
  guardarCopiaLocal();
  data = migrateLegacy(row.data);
  nuvemDefinirRev(row.rev);
  gravarLocal();
  nuvemMarcarPendente(false);
  nuvemStatus('ti-cloud-check', 'Nuvem em dia', '--c-grow');
}

async function nuvemCarregar() {
  nuvemStatus('ti-cloud-download', 'Carregando…');
  let r;
  try { r = await sb.from('carteira').select('data,rev').eq('user_id', nuvemUid).maybeSingle(); }
  catch (e) { r = { error: e }; }
  if (r.error) {
    // sem conexão: segue com a cópia deste aparelho e tenta de novo depois
    nuvemFalhou = true;
    nuvemStatus('ti-cloud-off', 'Sem nuvem · usando cópia local', '--c-warn');
    setTimeout(nuvemCarregar, 20000);
    if (rolloverIfNeeded()) {}
    render();
    return;
  }
  nuvemFalhou = false;
  nuvemPronta = true;
  const temLocal = data.corretores.length > 0;
  if (!r.data) {
    // primeira vez: a nuvem está vazia
    nuvemRev = null;
    if (temLocal) nuvemAgendar();
    else { nuvemMarcarPendente(false); nuvemStatus('ti-cloud', 'Nuvem vazia · restaure seu backup', '--c-warn'); }
  } else if (nuvemPendente() && temLocal) {
    if (nuvemRevLocal() === r.data.rev) { nuvemRev = r.data.rev; nuvemAgendar(); }   // só este aparelho mexeu
    else await nuvemConflito(r.data);
  } else {

  rolloverIfNeeded();
  render();
}

  try {
    const r = await sb.from('carteira').select('rev').eq('user_id', nuvemUid).maybeSingle();
    if (r.error || !r.data || r.data.rev === nuvemRev) return;
    const f = await sb.from('carteira').select('data,rev').eq('user_id', nuvemUid).maybeSingle();
    if (f.error || !f.data || nuvemPendente()) return;
    nuvemAdotar(f.data);
    rolloverIfNeeded();
    render();
  } catch (e) {}
}

async function nuvemSair() {
  if (!sb) return;
  const aviso = nuvemPendente() ? 'ATENÇÃO: há alterações que ainda NÃO foram enviadas para a nuvem e serão perdidas.\n\n' : '';
  if (!confirm(aviso + 'Sair da conta neste aparelho? A cópia local da carteira será apagada daqui (ela continua na nuvem).')) return;
  try { await sb.auth.signOut(); } catch (e) {}
  try { [STORAGE, STORAGE + '_mirror', STORAGE + '_antes_restaurar', NUVEM_PEND, NUVEM_REV].forEach(k => localStorage.removeItem(k)); } catch (e) {}
  dirtySinceBackup = false;
  data = { corretores: [], today: todayStr(), nextId: 0, history: [] };   // evita regravar ao fechar
  location.reload();
}

async function nuvemIniciar() {
  if (!nuvemLigada()) return;
  document.getElementById('cloud-status').classList.remove('hidden');
  document.getElementById('logout-btn').classList.remove('hidden');
  document.getElementById('logout-btn').onclick = nuvemSair;
  nuvemStatus('ti-cloud', 'Conectando…');
  try {
    await new Promise((ok, falha) => {
      const s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
      s.onload = ok; s.onerror = falha;
      document.head.appendChild(s);
    });
    sb = window.supabase.createClient(NUVEM.url, NUVEM.key);
    const s = await sb.auth.getSession();
    if (s.data && s.data.session) { nuvemUid = s.data.session.user.id; nuvemCarregar(); }
    else nuvemTelaLogin();
  } catch (e) {
    // sem internet na abertura: trabalha com a cópia local e avisa
    nuvemFalhou = true;
    nuvemStatus('ti-cloud-off', 'Sem nuvem · usando cópia local', '--c-warn');
    if (rolloverIfNeeded()) {}
    render();
  }
}

/* ============================================================
   RENDER + INIT
   ============================================================ */
function render() {
  try {
    buildNav();
    if (activeTab === 'dashboard') buildDashboard();
    else if (activeTab === 'followup') buildFollowup();
    else if (activeTab === 'lista') buildLista();
    else if (activeTab === 'relatorio') buildRelatorio();
    else if (activeTab === 'lixeira') buildLixeira();
  } catch (e) {
    // nunca deixar a tela em branco: mostra o erro e mantém o backup ao alcance
    console.error(e);
    document.getElementById('view').innerHTML = '<div class="card"><div class="sect-title" style="color:rgb(var(--c-alert));"><i class="ti ti-alert-triangle"></i>Algo deu errado ao montar esta tela</div>' +
      '<p class="hint" style="margin:0 0 1rem;">Seus dados continuam salvos. Baixe um backup agora por segurança e me envie a mensagem abaixo.</p>' +
      '<p style="font-family:monospace; font-size:12px; color:rgb(var(--c-ink2)); margin:0 0 1rem;">' + esc(e && e.message) + '</p>' +
      '<button class="btn btn-accent btn-sm" onclick="exportBackup()"><i class="ti ti-download"></i>Exportar backup completo</button></div>';
  }
}

// duas abas abertas: quando a outra salva, esta se atualiza (evita uma sobrescrever a outra)
window.addEventListener('storage', (e) => {
  if (e.key !== STORAGE || !e.newValue) return;
  try {
    const p = JSON.parse(e.newValue);
    if (p && Array.isArray(p.corretores)) { data = migrateLegacy(p); render(); }
  } catch (err) {}
});
// Esc fecha o card/modal aberto (menos a tela de login)
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  const ovs = document.querySelectorAll('.overlay:not(#login-ov)');
  if (ovs.length) { ovs[ovs.length - 1].remove(); openCardId = null; }
});

// Backup automático: SOMENTE quando a página é realmente fechada (clique no X,
// Ctrl+W, fechar a janela). beforeunload e pagehide disparam nesse momento.
// NÃO usamos visibilitychange para o backup, pois ele dispara ao trocar de aba
// ou minimizar — o que faria baixar backup à toa. Trocar de página DENTRO do
// sistema também não baixa nada (é a mesma página, só re-renderiza).
window.addEventListener('beforeunload', () => {
  gravarLocal();
  backupOnClose();
});
window.addEventListener('pagehide', (e) => {
  // persisted=true: página foi só p/ cache (voltar/avançar), não foi fechada
  if (!e.persisted) backupOnClose();
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { gravarLocal(); }
  else { if (rolloverIfNeeded()) render(); nuvemVerificar(); }
});

applyThemeIcon();
applyAutoBackupBtn();
tickClock();
setInterval(tickClock, 30000);
rolloverIfNeeded();   // no modo nuvem só vira o dia depois de carregar os dados (ver rolloverIfNeeded)
scheduleMidnight();
render();
if (recuperadoDaCopia) alert('O salvamento principal deste navegador estava ilegível e a carteira foi recuperada da cópia de segurança (estado da sessão anterior).\n\nConfira os últimos lançamentos e, se preciso, restaure o seu backup mais recente na aba Relatório.');
nuvemIniciar();

</script>
