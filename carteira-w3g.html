  (function () {

    try { t = localStorage.getItem("w3g_tema"); } catch (e) {}
    if (t !== "escuro") document.documentElement.setAttribute("data-tema", "claro"); // claro é o padrão
  })();
</script>
<style>
/* ====== TOKENS CARTEIRA ATIVA (Grupo W3G) ======
   Azul W3G #003C80 · Turquesa #2EC4B6 · Névoa #EEF2F5
   Mantém os MESMOS nomes de variável do sistema original (--c-* em triplets "R G B"),
   porque o JavaScript usa rgb(var(--c-…)) em estilos inline. Escuro = :root; claro = [data-tema="claro"]. */
:root {
  --c-canvas: 6 26 51;  --c-paper: 15 45 84;  --c-card: 11 36 69;
  --c-ink: 238 242 245;  --c-ink2: 183 198 216;  --c-muted: 126 147 173;
  --c-line: 30 62 104;  --c-line2: 23 52 90;
  --c-primary: 238 242 245;  --c-primary-100: 19 55 100;  --c-primary-600: 46 196 182;  --c-primary-500: 95 220 207;  --c-primary-400: 95 220 207;
  --c-accent: 46 196 182;  --c-accent-light: 95 220 207;  --c-accent-dark: 19 137 126;
  --c-dados: 110 168 255;  --c-dados-deep: 31 111 209;
  --c-alert: 255 107 120;  --c-grow: 70 214 140;  --c-drop: 255 138 96;  --c-warn: 255 186 74;
  --body-grad: radial-gradient(55% 45% at 92% 0%, rgba(46,196,182,.16), transparent 70%), radial-gradient(50% 45% at 0% 100%, rgba(31,111,209,.20), transparent 70%), #061A33;
  --glass-bg: rgba(11,36,69,.72);  --glass-border: rgba(255,255,255,.08);  --glass-claro-bg: rgba(6,26,51,.8);
  --selection-text: #003C80;  --logo-filter: none;
  --sh-card: 0 1px 0 rgba(255,255,255,.05) inset, 0 18px 40px -28px rgba(0,0,0,.8);
  --sh-soft: 0 4px 16px -4px rgba(0,0,0,.5);
  --sh-lift: 0 1px 0 rgba(255,255,255,.06) inset, 0 22px 44px -26px rgba(0,0,0,.85);
  --sh-float: 0 30px 60px -20px rgba(0,0,0,.75);
}
:root[data-tema="claro"] {
  --c-canvas: 238 242 245;  --c-paper: 244 247 250;  --c-card: 255 255 255;
  --c-ink: 10 37 71;  --c-ink2: 61 85 115;  --c-muted: 110 129 151;
  --c-line: 220 227 235;  --c-line2: 232 237 242;
  --c-primary: 0 60 128;  --c-primary-100: 220 232 247;  --c-primary-600: 0 60 128;  --c-primary-500: 31 95 175;  --c-primary-400: 74 134 208;
  --c-accent: 19 137 126;  --c-accent-light: 46 196 182;  --c-accent-dark: 13 110 101;
  --c-dados: 31 111 209;  --c-dados-deep: 0 60 128;
  --c-alert: 217 58 74;  --c-grow: 30 158 100;  --c-drop: 226 106 58;  --c-warn: 210 135 10;
  --body-grad: radial-gradient(55% 45% at 92% 0%, rgba(46,196,182,.20), transparent 70%), radial-gradient(50% 45% at 0% 100%, rgba(0,60,128,.10), transparent 70%), #EEF2F5;
  --glass-bg: rgba(255,255,255,.72);  --glass-border: rgba(0,60,128,.08);  --glass-claro-bg: rgba(255,255,255,.85);
  --selection-text: #003C80;  --logo-filter: none;
  --sh-card: 0 1px 0 rgba(255,255,255,.8) inset, 0 18px 40px -28px rgba(0,40,90,.35);
  --sh-soft: 0 4px 16px -6px rgba(0,40,90,.2);
  --sh-lift: 0 1px 0 rgba(255,255,255,.8) inset, 0 24px 44px -26px rgba(0,40,90,.4);
  --sh-float: 0 30px 60px -24px rgba(0,40,90,.45);
}

/* ====== REGRAS ORIGINAIS (estrutura preservada) ====== */



* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background-color: rgb(var(--c-canvas));
  background-image: var(--body-grad);
  background-attachment: fixed;
  color: rgb(var(--c-ink));
  font-family: "Inter", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  transition: background-color 0.35s ease, color 0.35s ease;
}
::selection { background: rgb(var(--c-accent)); color: var(--selection-text); }
::-webkit-scrollbar { width: 9px; height: 9px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgb(var(--c-line)); border-radius: 6px; }
::-webkit-scrollbar-thumb:hover { background: rgb(var(--c-muted)); }

.serif { font-family: "Cormorant Garamond", Georgia, serif; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 1.25rem 1.25rem 5rem; }

/* HEADER */
.brand-bar {
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  padding: 0.9rem 1.4rem; border-radius: 18px; margin-bottom: 1.25rem;
  background: var(--glass-claro-bg);
  backdrop-filter: blur(16px) saturate(140%);
  -webkit-backdrop-filter: blur(16px) saturate(140%);
  border: 1px solid var(--glass-border);
  box-shadow: 0 12px 40px -12px rgba(0,0,0,0.45);
  position: sticky; top: 8px; z-index: 30;
}
.brand-left { display: flex; align-items: center; gap: 14px; min-width: 0; }
.brand-logo { height: 38px; width: auto; filter: var(--logo-filter); flex-shrink: 0; }
.brand-divider { width: 1px; height: 34px; background: rgb(var(--c-line)); flex-shrink: 0; }
.brand-title { min-width: 0; }
.brand-title h1 {
  font-family: "Cormorant Garamond", Georgia, serif;
  font-size: 24px; font-weight: 600; margin: 0; line-height: 1;
  color: rgb(var(--c-primary)); letter-spacing: 0.04em;
}
.brand-title p { font-size: 11px; margin: 3px 0 0; color: rgb(var(--c-muted)); text-transform: uppercase; letter-spacing: 0.18em; font-weight: 700; }
.brand-right { display: flex; align-items: center; gap: 14px; flex-shrink: 0; }
.brand-meta { text-align: right; }
.brand-meta .clock { font-size: 13px; color: rgb(var(--c-ink2)); font-variant-numeric: tabular-nums; font-weight: 500; }
.brand-meta .save { font-size: 11px; color: rgb(var(--c-grow)); margin-top: 2px; display: flex; align-items: center; gap: 4px; justify-content: flex-end; }
.icon-round {
  width: 36px; height: 36px; border-radius: 50%; border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  color: rgb(var(--c-muted)); background: transparent; transition: all 0.15s;
}
.icon-round:hover { color: rgb(var(--c-accent-light)); background: rgba(255,255,255,0.08); }

/* NAV */
.nav {
  display: flex; align-items: center; gap: 2px; margin-bottom: 1.5rem;
  padding: 5px; border-radius: 16px; overflow-x: auto;
  background: var(--glass-claro-bg);
  backdrop-filter: blur(16px) saturate(140%);
  -webkit-backdrop-filter: blur(16px) saturate(140%);
  border: 1px solid var(--glass-border);
}
.nav-btn {
  white-space: nowrap; padding: 9px 16px; border-radius: 11px; border: none; cursor: pointer;
  font-family: inherit; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em;
  color: rgb(var(--c-muted)); background: transparent; transition: all 0.15s;
  display: flex; align-items: center; gap: 6px;
}
.nav-btn:hover { color: rgb(var(--c-primary)); background: rgba(255,255,255,0.06); }
.nav-btn.active { color: rgb(var(--c-primary)); background: rgb(var(--c-accent) / 0.15); }

/* CARDS */
.card {
  border: 1px solid rgb(var(--c-line)); border-radius: 16px; padding: 1.25rem;
  background: rgb(var(--c-card) / 0.92); box-shadow: var(--sh-card);
  transition: box-shadow 0.2s, transform 0.2s, border-color 0.2s;
}
.card:hover { box-shadow: var(--sh-lift); }

/* KPI */
.kpi-grid { display: grid; gap: 12px; margin-bottom: 1.5rem; }
.kpi {
  border: 1px solid rgb(var(--c-line)); border-radius: 16px; padding: 1.1rem 1.2rem;
  background: rgb(var(--c-card) / 0.92); box-shadow: var(--sh-card);
  transition: box-shadow 0.2s, transform 0.2s;
}
.kpi:hover { box-shadow: var(--sh-lift); transform: translateY(-2px); }
.kpi-value { font-family: "Cormorant Garamond", Georgia, serif; font-size: 38px; font-weight: 500; line-height: 1; color: rgb(var(--c-primary)); letter-spacing: -0.01em; }
.kpi-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.18em; color: rgb(var(--c-muted)); font-weight: 700; margin-top: 8px; }
.kpi-accent .kpi-value { color: rgb(var(--c-accent)); }
.kpi-dados .kpi-value { color: rgb(var(--c-dados)); }
.kpi-grow .kpi-value { color: rgb(var(--c-grow)); }

/* SECTION TITLES */
.section-title { font-family: "Cormorant Garamond", Georgia, serif; font-size: 28px; font-weight: 500; color: rgb(var(--c-primary)); line-height: 1.1; margin: 0; }
.etiqueta { font-size: 10px; text-transform: uppercase; letter-spacing: 0.22em; color: rgb(var(--c-accent-light)); font-weight: 700; display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
.etiqueta::before { content: ''; width: 24px; height: 1px; background: rgb(var(--c-accent)); display: inline-block; }
.divider-gold { height: 1px; width: 48px; background: rgb(var(--c-accent)); margin: 0 0 16px; border: none; }

/* PILLS / BADGES */
.pill { display: inline-flex; align-items: center; padding: 2px 9px; font-size: 10px; text-transform: uppercase; letter-spacing: 0.12em; font-weight: 700; border-radius: 7px; }

/* BUTTONS */
button { font-family: inherit; }
.btn {
  display: inline-flex; align-items: center; gap: 6px; justify-content: center;
  border: 1px solid rgb(var(--c-line)); border-radius: 10px; cursor: pointer;
  padding: 8px 13px; font-size: 13px; font-weight: 500;
  color: rgb(var(--c-ink)); background: rgb(var(--c-card) / 0.6); transition: all 0.15s;
}
.btn:hover:not(:disabled) { border-color: rgb(var(--c-accent) / 0.5); background: rgb(var(--c-card)); }
.btn:disabled { opacity: 0.35; cursor: default; }
.btn-accent { background: rgb(var(--c-accent) / 0.15); border-color: rgb(var(--c-accent) / 0.4); color: rgb(var(--c-accent-light)); }
.btn-accent:hover:not(:disabled) { background: rgb(var(--c-accent) / 0.25); }
.btn-ghost { background: transparent; border-color: transparent; }
.btn-ghost:hover:not(:disabled) { background: rgba(255,255,255,0.06); border-color: transparent; }
.btn-danger { border-color: rgb(var(--c-alert) / 0.4); color: rgb(var(--c-alert)); }
.btn-danger:hover:not(:disabled) { background: rgb(var(--c-alert) / 0.12); }
.btn-sm { padding: 6px 10px; font-size: 12px; }
.btn-icon { padding: 7px 9px; }

/* INPUTS */
input[type="text"], input[type="date"], input[type="number"], input[type="tel"], input[type="email"], input[type="password"], textarea, select {
  font-family: inherit; width: 100%;
  background: rgb(var(--c-paper) / 0.6); border: 1px solid rgb(var(--c-line));
  border-radius: 10px; color: rgb(var(--c-ink)); padding: 9px 12px; font-size: 14px; outline: none;
  transition: border-color 0.15s, box-shadow 0.15s;
}
input:focus, textarea:focus, select:focus { border-color: rgb(var(--c-accent) / 0.6); box-shadow: 0 0 0 3px rgb(var(--c-accent) / 0.12); }
textarea { resize: vertical; min-height: 64px; line-height: 1.5; }
label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: rgb(var(--c-muted)); font-weight: 600; display: block; margin-bottom: 5px; }
::placeholder { color: rgb(var(--c-muted)); opacity: 0.7; }

/* JOURNEY CARDS (follow-up) */
.jcard {
  border: 1px solid rgb(var(--c-line)); border-radius: 15px; padding: 14px 15px; margin-bottom: 12px;
  background: rgb(var(--c-card) / 0.9); box-shadow: var(--sh-card);
  transition: border-color 0.15s, box-shadow 0.15s;
}
.jcard:hover { box-shadow: var(--sh-lift); }
.jcard.star { border-color: rgb(var(--c-accent) / 0.5); background: radial-gradient(120% 90% at 0% 0%, rgb(var(--c-accent) / 0.10) 0%, transparent 55%), rgb(var(--c-card) / 0.9); box-shadow: 0 0 0 1px rgb(var(--c-accent) / 0.2), 0 8px 22px -12px rgb(var(--c-accent) / 0.45); }
.jcard.moplan { box-shadow: inset 3px 0 0 rgb(var(--c-dados)); }
.jcard-head { display: flex; align-items: center; gap: 11px; }
.jbar { height: 5px; background: rgb(var(--c-paper) / 0.7); border-radius: 4px; overflow: hidden; margin: 11px 0 0; }
.jbar-fill { height: 100%; background: linear-gradient(90deg, rgb(var(--c-accent)), rgb(var(--c-accent-light))); border-radius: 4px; transition: width 0.4s; }
.jmsg-wrap { margin-top: 11px; }
.jmsg-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 700; color: rgb(var(--c-accent-light)); margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
.jmsg {
  background: rgb(var(--c-paper) / 0.6); border: 1px solid rgb(var(--c-line)); border-radius: 11px;
  padding: 12px 14px; font-size: 14px; line-height: 1.55; color: rgb(var(--c-ink));
  white-space: pre-line;   /* preserva as quebras de linha da mensagem */
}
.jmsg-done { background: rgb(var(--c-grow) / 0.08); border-color: rgb(var(--c-grow) / 0.3); margin-top: 11px; display: flex; align-items: center; gap: 8px; font-size: 13.5px; }
.jmsg-warn { background: rgb(var(--c-warn) / 0.08); border-color: rgb(var(--c-warn) / 0.3); margin-top: 11px; display: flex; align-items: center; gap: 8px; font-size: 13.5px; }
.jcard-foot { display: flex; align-items: center; gap: 8px; margin-top: 11px; flex-wrap: wrap; }
.canal-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; padding: 2px 8px; border: 1px solid; border-radius: 20px; }
.jmsg-breakup { border-color: rgb(var(--c-accent) / 0.4); background: linear-gradient(180deg, rgb(var(--c-accent) / 0.06), rgb(var(--c-paper) / 0.6)); }
.jmsg-audio { border-color: rgb(var(--c-dados) / 0.4); background: linear-gradient(180deg, rgb(var(--c-dados) / 0.07), rgb(var(--c-paper) / 0.6)); font-style: italic; }
.audio-hint { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: rgb(var(--c-dados)); margin-bottom: 6px; }
.timing-row { display: flex; align-items: center; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
.timing-btn { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 500; padding: 4px 9px; border: 1px solid rgb(var(--c-line)); border-radius: 8px; background: transparent; color: rgb(var(--c-muted)); cursor: pointer; transition: all 0.15s; }
.timing-btn:hover { border-color: rgb(var(--c-accent) / 0.4); color: rgb(var(--c-ink2)); }

/* ROW (lista) */
.row {
  display: flex; align-items: center; gap: 12px; padding: 11px 13px;
  border: 1px solid rgb(var(--c-line)); border-radius: 13px; margin-bottom: 7px;
  background: rgb(var(--c-card) / 0.85); transition: border-color 0.15s, box-shadow 0.15s, transform 0.15s;
}
.row:hover { border-color: rgb(var(--c-accent) / 0.3); box-shadow: var(--sh-soft); }
.row.star { border-color: rgb(var(--c-accent) / 0.45); background: linear-gradient(90deg, rgb(var(--c-accent) / 0.08) 0%, rgb(var(--c-card) / 0.85) 22%); }
/* brilho dourado dos corretores estrela no follow-up — "luz dourada" */
.row.star-glow {
  border-color: rgb(var(--c-accent) / 0.55);
  background: linear-gradient(100deg, rgb(var(--c-accent) / 0.16) 0%, rgb(var(--c-accent) / 0.05) 30%, rgb(var(--c-card) / 0.9) 60%);
  box-shadow: 0 0 0 1px rgb(var(--c-accent) / 0.25), 0 0 22px -4px rgb(var(--c-accent) / 0.45), var(--sh-soft);
  animation: star-pulse 3.5s ease-in-out infinite;
}
.row.star-glow:hover { box-shadow: 0 0 0 1px rgb(var(--c-accent) / 0.4), 0 0 28px -2px rgb(var(--c-accent) / 0.6), var(--sh-lift); }
@keyframes star-pulse {
  0%, 100% { box-shadow: 0 0 0 1px rgb(var(--c-accent) / 0.22), 0 0 18px -6px rgb(var(--c-accent) / 0.38), var(--sh-soft); }
  50%      { box-shadow: 0 0 0 1px rgb(var(--c-accent) / 0.32), 0 0 26px -2px rgb(var(--c-accent) / 0.55), var(--sh-soft); }
}
@media (prefers-reduced-motion: reduce) { .row.star-glow { animation: none; } }
.row.moplan { box-shadow: inset 3px 0 0 rgb(var(--c-dados)); }
.avatar {
  width: 38px; height: 38px; border-radius: 11px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 700; font-family: "Cormorant Garamond", serif;
  background: rgb(var(--c-primary-600) / 0.25); color: rgb(var(--c-primary)); border: 1px solid rgb(var(--c-line));
}
.avatar.star { background: rgb(var(--c-accent) / 0.22); color: rgb(var(--c-accent-light)); border-color: rgb(var(--c-accent) / 0.55); box-shadow: 0 0 14px -2px rgb(var(--c-accent) / 0.6); }
.name-btn { flex: 1; min-width: 0; text-align: left; background: transparent; border: none; padding: 0; cursor: pointer; color: inherit; }
.name-btn:hover .nm { color: rgb(var(--c-accent-light)); }
.nm { margin: 0; font-size: 14.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 7px; color: rgb(var(--c-ink)); }
.row-flags { display: flex; align-items: center; gap: 4px; margin-top: 4px; }
.flag-btn { background: transparent; border: none; padding: 3px; cursor: pointer; font-size: 17px; line-height: 1; color: rgb(var(--c-muted)); border-radius: 6px; transition: all 0.15s; }
.flag-btn:hover { background: rgba(255,255,255,0.08); }
.flag-btn.star-on { color: rgb(var(--c-accent)); }
.flag-btn.moplan-on { color: rgb(var(--c-dados)); }

.list { max-height: 480px; overflow-y: auto; padding-right: 3px; }
.muted { color: rgb(var(--c-muted)); }
.hint { font-size: 12px; color: rgb(var(--c-muted)); }
.empty { text-align: center; color: rgb(var(--c-muted)); padding: 2.5rem 1rem; font-size: 14px; }

/* BANNER */
.banner { display: flex; align-items: center; gap: 9px; padding: 11px 14px; background: rgb(var(--c-alert) / 0.12); border: 1px solid rgb(var(--c-alert) / 0.3); border-radius: 12px; margin-bottom: 1rem; }
.banner.soneca { background: rgb(var(--c-dados) / 0.1); border-color: rgb(var(--c-dados) / 0.3); }

/* PIPELINE */
/* todas as colunas têm a MESMA altura fixa e alinham no topo; a rolagem é
   interna a cada coluna, então a "Solicitado" com 45 cards não estica a página */
.pipeline { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(190px, 1fr); gap: 14px; align-items: stretch; height: 640px; overflow-x: auto; padding-bottom: 8px; }
.pipeline::-webkit-scrollbar { height: 9px; }
.pipeline::-webkit-scrollbar-thumb { background: rgb(var(--c-line)); border-radius: 8px; }
.pipe-col {
  background: rgb(var(--c-paper) / 0.4);
  border: 1px solid rgb(var(--c-line));
  border-radius: 18px;
  display: flex; flex-direction: column;
  min-height: 0;            /* permite o filho rolar dentro do flex */
  overflow: hidden;         /* respeita o raio nas pontas */
}
.pipe-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 15px 18px 14px;
  border-bottom: 1px solid rgb(var(--c-line));
  flex-shrink: 0;
}
.pipe-head .ph-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.14em; font-weight: 700; color: rgb(var(--c-ink2)); }
.pipe-head .ph-count { font-family: "Cormorant Garamond", serif; font-size: 24px; font-weight: 600; line-height: 1; }
/* área rolável: ocupa o resto da coluna; a barra fica num gutter estável
   (scrollbar-gutter) para nunca passar por cima do conteúdo do card */
.pipe-body {
  flex: 1; min-height: 0;
  padding: 16px 14px 16px 16px;
  overflow-y: auto;
  overflow-x: hidden;
  scrollbar-gutter: stable;
}
.pipe-body::-webkit-scrollbar { width: 8px; }
.pipe-body::-webkit-scrollbar-track { background: transparent; margin: 6px 0; }
.pipe-body::-webkit-scrollbar-thumb { background: rgb(var(--c-line)); border-radius: 10px; border: 2px solid transparent; background-clip: padding-box; }
.pipe-body::-webkit-scrollbar-thumb:hover { background: rgb(var(--c-muted)); background-clip: padding-box; }
.pipe-card {
  position: relative;
  background: rgb(var(--c-card));
  border: 1px solid rgb(var(--c-line));
  border-radius: 14px;
  padding: 15px 16px 14px;
  margin-bottom: 13px;
  cursor: pointer;
  transition: border-color 0.15s, transform 0.15s, box-shadow 0.15s;
}
.pipe-card:last-child { margin-bottom: 4px; }
.pipe-card:hover { border-color: rgb(var(--c-accent) / 0.4); transform: translateY(-2px); box-shadow: var(--sh-soft); }
.pipe-card.star {
  border-color: rgb(var(--c-accent) / 0.5);
  background:
    radial-gradient(120% 90% at 0% 0%, rgb(var(--c-accent) / 0.14) 0%, transparent 55%),
    rgb(var(--c-card));
  box-shadow: 0 0 0 1px rgb(var(--c-accent) / 0.22), 0 8px 22px -12px rgb(var(--c-accent) / 0.5);
}
.pipe-card .pc-name { font-size: 14px; font-weight: 600; line-height: 1.35; display: flex; align-items: center; gap: 7px; margin-bottom: 7px; color: rgb(var(--c-ink)); }
.pipe-card .pc-name span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pipe-card .pc-sub { font-size: 11.5px; color: rgb(var(--c-muted)); line-height: 1.45; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pipe-move { display: flex; gap: 7px; margin-top: 14px; }
.pipe-move button {
  flex: 1; padding: 7px; font-size: 13px; border-radius: 9px;
  border: 1px solid rgb(var(--c-line)); background: rgb(var(--c-paper) / 0.5);
  color: rgb(var(--c-muted)); cursor: pointer; transition: all 0.15s;
  display: flex; align-items: center; justify-content: center;
}
.pipe-move button:hover:not(:disabled) { color: rgb(var(--c-accent-light)); border-color: rgb(var(--c-accent) / 0.4); background: rgb(var(--c-card)); }
.pipe-move button:disabled { opacity: 0.25; cursor: default; }
.pipe-empty { text-align: center; color: rgb(var(--c-muted)); padding: 1.8rem 0; font-size: 16px; opacity: 0.35; }

/* MODAL */
.overlay { position: fixed; inset: 0; background: rgba(3,6,15,0.7); display: flex; align-items: flex-start; justify-content: center; z-index: 100; padding: 2rem 1rem; overflow-y: auto; backdrop-filter: blur(3px); }
.modal {
  background: rgb(var(--c-card)); border: 1px solid var(--glass-border); border-radius: 18px;
  max-width: 560px; width: 100%; box-shadow: var(--sh-float); overflow: hidden;
  animation: modalIn 0.2s cubic-bezier(.2,.8,.2,1);
}
@keyframes modalIn { from { opacity: 0; transform: translateY(10px) scale(0.98); } to { opacity: 1; transform: none; } }
.modal-head { padding: 1.4rem 1.5rem; position: relative; background: linear-gradient(135deg, rgb(var(--c-primary-600)) 0%, rgb(var(--c-primary-500)) 100%); color: #fff; }
.modal-head.star { background: linear-gradient(135deg, #b8860b 0%, #d4a017 100%); }
.modal-head .mh-title { font-family: "Cormorant Garamond", serif; font-size: 24px; font-weight: 600; margin: 0; display: flex; align-items: center; gap: 9px; padding-right: 36px; line-height: 1.1; }
.modal-head .mh-sub { font-size: 12px; opacity: 0.92; margin-top: 5px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.modal-close { position: absolute; top: 16px; right: 16px; width: 30px; height: 30px; border-radius: 9px; border: none; background: rgba(255,255,255,0.2); color: #fff; cursor: pointer; font-size: 19px; display: flex; align-items: center; justify-content: center; }
.modal-close:hover { background: rgba(255,255,255,0.32); }
.modal-body { padding: 1.4rem 1.5rem; max-height: 64vh; overflow-y: auto; }
.field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.9rem; margin-bottom: 1.2rem; }
.field-grid .full { grid-column: 1 / -1; }
.field-meta { font-size: 10px; color: rgb(var(--c-muted)); margin-top: 4px; letter-spacing: 0.02em; }
.sect-title { font-size: 12px; text-transform: uppercase; letter-spacing: 0.14em; font-weight: 700; color: rgb(var(--c-accent-light)); margin: 0 0 0.8rem; display: flex; align-items: center; gap: 7px; }
.note-item { padding: 10px 12px; border: 1px solid rgb(var(--c-line)); border-radius: 11px; margin-bottom: 7px; background: rgb(var(--c-paper) / 0.5); }
.note-date { font-size: 10.5px; color: rgb(var(--c-muted)); margin-bottom: 4px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.note-text { font-size: 13.5px; line-height: 1.5; }
.modal-divider { height: 1px; background: rgb(var(--c-line)); margin: 1.3rem 0; border: none; }
.info-box { display: flex; gap: 1.5rem; flex-wrap: wrap; padding: 11px 13px; background: rgb(var(--c-paper) / 0.5); border-radius: 11px; margin-bottom: 1.2rem; }

/* FILTER CHIPS */
.chips { display: flex; gap: 7px; flex-wrap: wrap; align-items: center; }
.chip { padding: 6px 12px; font-size: 12.5px; font-weight: 500; border-radius: 9px; border: 1px solid rgb(var(--c-line)); background: transparent; color: rgb(var(--c-ink2)); cursor: pointer; transition: all 0.15s; }
.chip:hover { border-color: rgb(var(--c-accent) / 0.4); }
.chip.active { background: rgb(var(--c-accent) / 0.15); border-color: rgb(var(--c-accent) / 0.4); color: rgb(var(--c-accent-light)); }
.chip.active-dados { background: rgb(var(--c-dados) / 0.12); border-color: rgb(var(--c-dados) / 0.4); color: rgb(var(--c-dados)); }

.hidden { display: none !important; }
/* modo nuvem: esconde a carteira enquanto a tela de login está aberta */
body.bloqueado .wrap { display: none; }
@media (max-width: 720px) {
  .pipeline { grid-template-columns: 1fr; height: auto; }
  .pipe-col { min-height: 0; }
  .pipe-body { max-height: 400px; }
  .field-grid { grid-template-columns: 1fr; }
  .kpi-value { font-size: 32px; }
}

/* ============================================================
   CAMADA CARTEIRA ATIVA — layout "Orquídea" (rail + bento)
   Vem DEPOIS das regras originais e as sobrescreve.
   ============================================================ */
:root{--ativa-font-display:'Jost',system-ui,sans-serif;--ativa-font-body:'Figtree',system-ui,sans-serif;--ativa-font-mono:'Azeret Mono',ui-monospace,monospace;--ativa-blue:#003C80;--ativa-turq:#2EC4B6;--ativa-turq-deep:#13897E;--ativa-nevoa:#EEF2F5;--ativa-rail:#003C80;--ativa-rail-ink:255 255 255;--ativa-on-turq:#003C80;--r-sm:12px;--r-md:18px;--r-lg:24px;--r-xl:32px;--rail-w:96px}
:root:not([data-tema="claro"]){--ativa-rail:#0B2445;--ativa-on-turq:#04203F}
html,body{font-family:var(--ativa-font-body)}
body{background:var(--body-grad);background-attachment:fixed}
.serif{font-family:var(--ativa-font-display)!important;font-weight:600!important;letter-spacing:-0.03em}
::selection{background:var(--ativa-turq);color:var(--ativa-blue)}
a{color:rgb(var(--c-primary-500))}a:hover{color:var(--ativa-turq-deep)}

/* ---------- casca: rail lateral + cabeçalho ---------- */
.wrap{max-width:1320px;margin:0;padding:14px 28px 48px calc(var(--rail-w) + 40px)}
.nav{position:fixed;z-index:40;left:14px;top:14px;bottom:14px;width:var(--rail-w);margin:0;padding:96px 0 18px;display:flex;flex-direction:column;align-items:center;gap:6px;overflow:visible;background:var(--ativa-rail);border:0;border-radius:var(--r-xl);box-shadow:0 30px 60px -30px rgba(0,30,70,.55)}
.nav::before{content:"";position:absolute;top:24px;left:50%;width:58px;height:32px;transform:translateX(-50%);background:url("assets/simbolo-fundo-escuro.svg") center/contain no-repeat}
.nav-btn{flex-direction:column;justify-content:center;gap:5px;width:68px;height:62px;padding:0;border:0;border-radius:var(--r-md);background:transparent;color:rgb(var(--ativa-rail-ink) / .72);font:600 10.5px/1 var(--ativa-font-body);letter-spacing:0;position:relative;box-shadow:none}
.nav-btn i{font-size:22px;margin:0!important}
.nav-btn:hover{background:rgb(var(--ativa-rail-ink) / .1);color:#fff}
.nav-btn.active{background:var(--ativa-turq);color:var(--ativa-on-turq);box-shadow:none}
.nav-btn span{position:absolute;top:5px;right:6px;margin:0!important}
.brand-bar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 6px 26px;margin:0;background:transparent;border:0;box-shadow:none;backdrop-filter:none;position:static}
.brand-left{display:flex;align-items:center;gap:16px}
.brand-divider{width:1px;height:30px;background:rgb(var(--c-line))}
.brand-title h1{font:600 15px/1.1 var(--ativa-font-body);letter-spacing:0;color:rgb(var(--c-ink));margin:0}
.brand-title p{font:400 12.5px/1.3 var(--ativa-font-body);color:rgb(var(--c-muted));margin:3px 0 0}
.brand-right{display:flex;align-items:center;gap:8px;background:var(--glass-bg);backdrop-filter:blur(20px);padding:7px 7px 7px 16px;border-radius:999px;border:1px solid var(--glass-border)}
.brand-meta{display:flex;align-items:center;gap:12px}
.brand-meta .clock{font:500 12.5px/1 var(--ativa-font-mono);color:rgb(var(--c-ink2))}
.icon-round{width:38px;height:38px;border-radius:50%;border:1px solid rgb(var(--c-line));background:rgb(var(--c-card));color:rgb(var(--c-ink2))}
.icon-round:hover{border-color:var(--ativa-turq);color:rgb(var(--c-ink))}
.ativa-logo{display:inline-flex;align-items:center;gap:12px;color:rgb(var(--c-primary));text-decoration:none}
.ativa-logo svg{height:30px;width:auto;flex-shrink:0}
.ativa-logo b{font:600 24px/1 var(--ativa-font-display);letter-spacing:-0.02em;white-space:nowrap}
.ativa-logo small{display:block;font:500 9.5px/1 var(--ativa-font-display);letter-spacing:.22em;text-transform:uppercase;opacity:.65;margin-top:5px;white-space:nowrap}

/* ---------- títulos ---------- */
.section-title{font:700 34px/1.05 var(--ativa-font-display)!important;letter-spacing:-0.03em;color:rgb(var(--c-ink))}
.etiqueta{display:flex;align-items:center;gap:8px;font:500 13px/1 var(--ativa-font-body);letter-spacing:0;text-transform:none;color:rgb(var(--c-ink2));margin-bottom:8px}
.etiqueta::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ativa-turq);flex-shrink:0}
.sect-title{font:700 17px/1.1 var(--ativa-font-display)!important;letter-spacing:-0.01em;text-transform:none;color:rgb(var(--c-ink))}
.sect-title i{width:30px;height:30px;border-radius:50%;display:inline-grid;place-items:center;background:rgb(var(--c-paper));color:rgb(var(--c-primary-500));font-size:15px}

/* ---------- superfícies (bento) ---------- */
.card,.jcard,.kpi{background:rgb(var(--c-card));border:0;border-radius:var(--r-lg);box-shadow:var(--sh-card)}
.card{padding:24px}
.card:hover,.kpi:hover,.jcard:hover{transform:none;box-shadow:var(--sh-lift)}
.kpi-grid{gap:14px}
.kpi{padding:18px 20px}
.kpi-value{font:700 38px/1 var(--ativa-font-display)!important;letter-spacing:-0.04em;color:rgb(var(--c-ink))}
.kpi-label{font:500 12.5px/1.2 var(--ativa-font-body);text-transform:none;letter-spacing:0;color:rgb(var(--c-muted));margin-top:8px}
.kpi-accent{background:var(--ativa-turq)}
.kpi-accent .kpi-value,.kpi-accent .kpi-label{color:var(--ativa-on-turq)!important}
.kpi-dados .kpi-value{color:rgb(var(--c-dados))}
.kpi-grow .kpi-value{color:rgb(var(--c-grow))}
.info-box{border-radius:var(--r-md)}

/* ---------- botões, chips, pills, avatar ---------- */
.btn{border-radius:999px;font-family:var(--ativa-font-body);font-weight:600}
.btn-accent{background:var(--ativa-blue);border-color:var(--ativa-blue);color:#fff}
.btn-accent:hover:not(:disabled){background:var(--ativa-turq);border-color:var(--ativa-turq);color:var(--ativa-blue)}
:root:not([data-tema="claro"]) .btn-accent{background:var(--ativa-turq);border-color:var(--ativa-turq);color:var(--ativa-on-turq)}
:root:not([data-tema="claro"]) .btn-accent:hover:not(:disabled){background:#5FDCCF;border-color:#5FDCCF}
.chip{border-radius:999px;font-family:var(--ativa-font-body)}
.chip.active{background:var(--ativa-turq);border-color:var(--ativa-turq);color:var(--ativa-on-turq)}
.pill{border-radius:999px}
.avatar{border-radius:50%}
.avatar.star{background:var(--ativa-turq);color:var(--ativa-on-turq);border-color:var(--ativa-turq)}
.flag-btn.star-on{color:var(--ativa-turq-deep)}
:root:not([data-tema="claro"]) .flag-btn.star-on{color:var(--ativa-turq)}
.timing-btn,.canal-badge{border-radius:999px}

/* ---------- formulários ---------- */
input[type="text"],input[type="date"],input[type="number"],input[type="tel"],input[type="email"],input[type="password"],textarea,select{border-radius:var(--r-sm);font-family:var(--ativa-font-body)}
input:focus,textarea:focus,select:focus{border-color:var(--ativa-turq);box-shadow:0 0 0 3px rgba(46,196,182,.28)}

/* ---------- listas, follow-up, pipeline ---------- */
.row{border-radius:var(--r-md)}
.jcard{padding:18px}
.jbar{height:8px;border-radius:999px}
.jbar-fill{border-radius:999px;background:linear-gradient(90deg,var(--ativa-turq),rgb(var(--c-primary-500)))}
.jmsg-wrap,.jmsg{border-radius:var(--r-md)}
.banner{border-radius:var(--r-md)}
.pipe-col{border:0;border-radius:var(--r-lg);background:rgb(var(--c-card) / .55)}
.pipe-card{border-radius:var(--r-md)}
.pipe-card.star{box-shadow:inset 0 2px 0 var(--ativa-turq)}

/* ---------- modal ---------- */
.overlay{background:rgba(0,30,64,.38);backdrop-filter:blur(6px)}
.modal{border:0;border-radius:var(--r-xl);box-shadow:0 40px 80px -30px rgba(0,30,64,.55)}
.modal-head{border-radius:var(--r-xl) var(--r-xl) 0 0}
.modal-head .mh-title{font:700 26px/1.1 var(--ativa-font-display)!important;letter-spacing:-0.03em}
.modal-head.star{background:var(--ativa-turq)}
.modal-head.star .mh-title,.modal-head.star .mh-sub{color:var(--ativa-on-turq)!important}
.modal-close{border-radius:50%}
.note-item{border-radius:var(--r-md)}

/* ---------- ajustes finos ---------- */
.nav-btn{text-transform:none!important;letter-spacing:0!important}
.brand-title h1{white-space:nowrap}
.brand-title p{text-transform:none!important;letter-spacing:0!important;font-size:12.5px!important;color:rgb(var(--c-muted))!important}
.chip,.btn,.timing-btn{white-space:nowrap}
.avatar{font-family:var(--ativa-font-body)!important;font-weight:700;letter-spacing:.02em}
.pipe-head .ph-count,.mh-title,.kpi-value,.empty{font-family:var(--ativa-font-display)!important}
.pipe-head .ph-label{text-transform:none;letter-spacing:0;font:700 13px/1 var(--ativa-font-body)}
.pill{text-transform:none!important;letter-spacing:0!important;font-weight:600}
.jmsg-label{text-transform:none!important;letter-spacing:0!important;font-weight:600}
.chips{row-gap:8px}
.brand-left,.brand-title{min-width:0}
.brand-title h1,.brand-title p{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.modal-body{overflow-x:hidden}
@media (max-width:1180px){.brand-title,.brand-divider{display:none}#cloud-status span{display:none}}

/* ---------- mobile: barra inferior em pílula + bottom sheet ---------- */
@media (max-width:860px){
  .wrap{padding:10px 14px calc(110px + env(safe-area-inset-bottom))}
  .nav{top:auto;left:10px;right:10px;bottom:calc(12px + env(safe-area-inset-bottom));width:auto;height:66px;padding:0 6px;flex-direction:row;justify-content:space-between;gap:2px;border-radius:999px}
  .nav::before{display:none}
  .nav-btn{flex:1;width:auto;min-width:0;height:52px;border-radius:999px;font-size:9.5px;gap:3px}
  .nav-btn i{font-size:20px}
  .brand-bar{padding:6px 2px 18px;flex-wrap:nowrap}
  .brand-divider,.brand-title,.brand-meta{display:none}
  .brand-right{padding:4px;gap:4px;flex-shrink:0}
  .icon-round{width:36px;height:36px}
  .ativa-logo b{font-size:20px}.ativa-logo svg{height:24px}
  .section-title{font-size:26px!important}
  .kpi-value{font-size:30px!important}
  .overlay{align-items:flex-end!important;padding:0!important}
  .modal{max-width:none!important;width:100%;border-radius:28px 28px 0 0;max-height:92vh;overflow:auto}
  .modal-head{border-radius:28px 28px 0 0}
  /* ficha do corretor: uma rolagem só (o corpo rola, o cabeçalho fica parado) */
  .modal:has(> .modal-body){display:flex;flex-direction:column;overflow:hidden}
  .modal > .modal-body{flex:1;min-height:0;max-height:none;padding-bottom:calc(1.4rem + env(safe-area-inset-bottom))}
  /* linha do corretor: nome em cima, botões embaixo (o nome não some mais) */
  .row{flex-wrap:wrap;row-gap:10px}
  .row > .name-btn{flex:1 1 55%}
  .row > .name-btn + .btn,.row > .name-btn + button{margin-left:auto}
}
@media (max-width:560px){
  .row > .name-btn{flex-basis:calc(100% - 110px)}
  .kpi-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important}
}
/* celular: interface compacta (cartões, filtros e números menores) */
@media (max-width:560px){
  .wrap{padding:8px 12px calc(96px + env(safe-area-inset-bottom))}
  .brand-bar{padding:4px 2px 12px}
  .ativa-logo b{font-size:18px}.ativa-logo svg{height:21px}.ativa-logo small{font-size:8.5px;margin-top:4px}
  .icon-round{width:32px;height:32px;font-size:14px}
  .etiqueta{font-size:11.5px;margin-bottom:5px}.etiqueta::before{width:6px;height:6px}
  .section-title{font-size:21px!important}
  .hint{font-size:11.5px}
  .kpi-grid{gap:8px;margin-bottom:.9rem}
  .kpi{padding:11px 13px;border-radius:16px}
  .kpi-value{font-size:22px!important}
  .kpi-label{font-size:11px;margin-top:4px}
  .chips{gap:5px;row-gap:6px}
  .chip{padding:4px 9px;font-size:11px}
  .btn{font-size:12px;padding:7px 12px}
  .btn-sm{font-size:11px;padding:5px 9px}
  .btn-icon{padding:5px 7px}
  .card{padding:15px;border-radius:18px}
  .sect-title{font-size:14.5px!important}
  .sect-title i{width:25px;height:25px;font-size:13px}
  .jcard{padding:12px;border-radius:16px}
  .jmsg{font-size:12.5px;line-height:1.5;padding:10px 12px}
  .jmsg-label{font-size:10.5px}
  .timing-btn{font-size:10.5px;padding:4px 8px}
  .row{padding:9px 10px;gap:8px;row-gap:7px;border-radius:14px}
  .avatar{width:32px;height:32px;font-size:11px}
  .nm{font-size:13px}
  .pill{font-size:9.5px;padding:2px 7px}
  .flag-btn{font-size:14px}
  .nav{height:58px;left:8px;right:8px;bottom:calc(10px + env(safe-area-inset-bottom))}
  .nav-btn{height:46px;font-size:9px;gap:2px}
  .nav-btn i{font-size:18px}
  .row > .name-btn{flex-basis:calc(100% - 84px)}
  .wrap .serif[style*="font-size:26px"]{font-size:19px!important;min-width:30px!important}
  .wrap .serif[style*="font-size:28px"],.wrap .serif[style*="font-size:30px"],.wrap .serif[style*="font-size:32px"]{font-size:21px!important}
  .modal-head .mh-title{font-size:20px!important}
  .modal > .modal-body{padding:1rem 1rem calc(1.2rem + env(safe-area-inset-bottom))}
}
@media (max-width:359px){
  .ativa-logo{gap:8px}.ativa-logo b{font-size:17px}.ativa-logo svg{height:20px}.ativa-logo small{font-size:8px;letter-spacing:.16em}
  .nav-btn{font-size:8.5px}
}
/* nada estoura a largura do cartão */
.kpi,.kpi-grid > *,.field-grid > *,.card,.jcard,.row{min-width:0}
.wrap [style*="grid-template-columns"] > *{min-width:0}
input,select,textarea{max-width:100%;min-width:0}
.mh-title{overflow-wrap:anywhere}
.pill{white-space:nowrap}
/* nome comprido: reticências no computador, até 2 linhas no celular */
.nm{display:block}
.nm > i{margin-right:6px}
@media (max-width:860px){.nm{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}}

/* ---------- céu estrelado: fundo da tela de login; depois do login fica só de leve ---------- */
#ceu{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden;color:#fff}
#ceu::before{content:"";position:absolute;inset:0;opacity:0;transition:opacity 1.2s ease;background:radial-gradient(60% 50% at 85% 8%,rgba(46,196,182,.22),transparent 70%),radial-gradient(55% 50% at 8% 92%,rgba(31,111,209,.30),transparent 70%),radial-gradient(40% 35% at 50% 45%,rgba(0,60,128,.35),transparent 75%),linear-gradient(160deg,#020812 0%,#061A33 55%,#03101F 100%)}
#ceu .estrelas{position:absolute;inset:0;opacity:.4;transition:opacity 1.2s ease}
#ceu .estrelas i{position:absolute;left:0;top:0;border-radius:50%;background:transparent;animation:ceu-piscar 5s ease-in-out infinite}
#ceu .estrelas i:nth-child(1){width:1px;height:1px}
#ceu .estrelas i:nth-child(2){width:2px;height:2px;animation-duration:7s;animation-delay:-2s}

const CONTATO_ESPACAR_A_PARTIR = 9;
function intervaloDoContato(stage, numContato) {
  const st = STAGES[stageIndex(stage)];
  if (!st) return 1;
  const base = st.cadence === 'alt' ? 2 : (st.cadence === 'daily' ? 1 : 0);
  if (base === 0) return 0; // sem follow-up
  if (numContato >= CONTATO_ESPACAR_A_PARTIR) {
    return base === 1 ? 3 : 4; // diário→3, 2dias→4

  return base;
}

  '01-01', // Confraternização
  '04-21', // Tiradentes
  '05-01', // Dia do Trabalho
  '09-07', // Independência
  '10-12', // Nossa Senhora Aparecida
  '11-02', // Finados
  '11-15', // Proclamação da República
  '12-25', // Natal
];
function ehFeriado(d) {
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const dd = String(d.getDate()).padStart(2,'0');
  return FERIADOS_FIXOS.includes(mm + '-' + dd);
}
function ehDiaUtil(d) {
  const dow = d.getDay();
  return dow !== 0 && dow !== 6 && !ehFeriado(d);
}
// hoje é o 1º dia útil após um feriado? (olha os dias anteriores até achar um dia útil;
// se o dia imediatamente "trabalhável" anterior foi feriado, então sim)
function ehPosFeriado(d) {
  let ant = new Date(d);
  ant.setDate(ant.getDate() - 1);
  // pula fins de semana para trás
  let achouFeriado = false;
  let seguranca = 0;
  while (seguranca < 7) {
    const dow = ant.getDay();
    if (dow === 0 || dow === 6) { ant.setDate(ant.getDate()-1); seguranca++; continue; }
    // é dia de semana: se for feriado, marca; senão para
    if (ehFeriado(ant)) { achouFeriado = true; ant.setDate(ant.getDate()-1); seguranca++; continue; }
    break;
  }
  return achouFeriado;
}

// garante estrutura de jornada no corretor
function ensureJornada(c) {
  if (!c.jornada) {
    c.jornada = { etapaAtual: c.stage, contato: 1 };
  }
  if (!c.msgHist) c.msgHist = []; // mensagens (texto base) já enviadas — vitalício por corretor
  if (!c.fechHist) c.fechHist = []; // fechamentos já usados com este corretor
  if (!c.contatoLog) c.contatoLog = []; // registro de cada contato feito
  // se a etapa mudou desde a última vez, reinicia a jornada no contato 1
  if (c.jornada.etapaAtual !== c.stage) {
    c.jornada.etapaAtual = c.stage;
    c.jornada.contato = 1;
  }
}

function primeiroNome(name) {
  const clean = name.replace(/[|\-].*$/, '').trim();
  const p = clean.split(/\s+/).filter(Boolean);
  return p[0] || name;
}

// escolhe o tema do contato de hoje, aplicando travas de dia
function temaDoContato(c, dataRef) {
  const jornada = JORNADAS[c.stage];
  if (!jornada) return null;
  const passo = jornada[Math.min(c.jornada.contato - 1, jornada.length - 1)];
  let tema = passo.tema;
  const formato = passo.formato || 'texto';

  // travas de dia sobrepõem o tema base quando o dia bate.
  // IMPORTANTE: só substituem contatos de TEXTO — os contatos de áudio são
  // pontos deliberados da jornada e não devem virar mensagem escrita.
  // Temas diretos (escritos para avançar a etapa) também nunca são trocados.
  if (formato === 'texto' && !TEMAS_DIRETOS.has(tema)) {
    const dow = dataRef.getDay();
    // pós-feriado tem prioridade máxima
    if (ehPosFeriado(dataRef) && MSG['pos_feriado']) {
      if (temMsgDisponivel(c, 'pos_feriado')) return { tema: 'pos_feriado', passoNum: passo.n, substituido: true, formato: 'texto' };
    }
    if (dow === 1 && MSG['fim_de_semana']) { // segunda
      if (temMsgDisponivel(c, 'fim_de_semana')) return { tema: 'fim_de_semana', passoNum: passo.n, substituido: true, formato: 'texto' };
    }
    if (dow === 5 && MSG['boa_sexta']) { // sexta
      if (temMsgDisponivel(c, 'boa_sexta')) return { tema: 'boa_sexta', passoNum: passo.n, substituido: true, formato: 'texto' };
    }
  }
  return { tema, passoNum: passo.n, substituido: false, formato: formato };
}

function temMsgDisponivel(c, tema) {
  const pool = MSG[tema] || [];
  return pool.some(m => !c.msgHist.includes(m));
}

// pega uma mensagem não usada do tema (não-repetição vitalícia)
function escolherMensagem(c, tema) {
  const pool = MSG[tema] || [];
  const disponiveis = pool.filter(m => !c.msgHist.includes(m));
  if (disponiveis.length === 0) return null; // esgotou
  // escolhe de forma estável-aleatória
  const idx = Math.floor(Math.random() * disponiveis.length);
  return disponiveis[idx];
}

// escolhe um fechamento contextual da etapa que este corretor ainda não recebeu.
// Se todos já foram usados, recicla (o fechamento é curto e pode voltar sem estranhar).
function escolherFechamento(c) {
  const pool = FECHAMENTOS[c.stage] || [];
  if (!pool.length) return null;
  c.fechHist = c.fechHist || [];
  let disp = pool.filter(f => !c.fechHist.includes(f));
  if (!disp.length) { c.fechHist = []; disp = pool; }  // recicla quando esgota
  return disp[Math.floor(Math.random() * disp.length)];
}

// monta a mensagem final do dia para o corretor (sem marcar como enviada ainda)
function gerarContatoDia(c, dataRef) {
  ensureJornada(c);
  dataRef = dataRef || new Date();
  const jornada = JORNADAS[c.stage];
  if (!jornada) return { erro: 'sem_jornada' };
  if (c.jornada.contato > jornada.length) return { erro: 'jornada_concluida' };

  const t = temaDoContato(c, dataRef);
  if (!t) return { erro: 'sem_tema' };
  let msgBase = escolherMensagem(c, t.tema);
  let esgotou = false;
  if (!msgBase) {
    // tema esgotado para este corretor: tenta o tema base do passo se o esgotado era uma trava de dia
    if (t.substituido) {
      const passo = jornada[Math.min(c.jornada.contato - 1, jornada.length - 1)];
      msgBase = escolherMensagem(c, passo.tema);
      if (msgBase) { t.tema = passo.tema; }
    }
  }
  if (!msgBase) { esgotou = true; }

  const nome = primeiroNome(c.name);
  const formato = t.formato || 'texto';
  const ehBreakup = t.tema === 'break_up' || t.tema === 'audio_break_up';
  // fechamento contextual: só em mensagens de TEXTO e nunca no break-up
  // (a despedida não pede nada — é justamente o que a faz funcionar)
  let fechamento = null;
  // temas diretos já terminam com o próprio pedido de ação — não duplicar
  if (msgBase && formato === 'texto' && !ehBreakup && !TEMAS_DIRETOS.has(t.tema)) {
    fechamento = escolherFechamento(c);
  }
  let texto = msgBase ? msgBase.replace(/\{nome\}/g, nome) : null;
  if (texto && fechamento) texto = texto + '\n' + fechamento.replace(/\{nome\}/g, nome);

  return {
    contatoNum: c.jornada.contato,
    totalContatos: jornada.length,
    tema: t.tema,
    temaSubstituido: t.substituido,
    msgBase: msgBase,        // texto com {nome} ainda — usado para registrar no histórico
    fechamento: fechamento,  // fechamento usado (registrado ao marcar Falei)
    texto: texto,            // texto final para copiar (mensagem + fechamento)
    esgotou: esgotou,
    etapaLabel: (STAGES[stageIndex(c.stage)] || {}).label || c.stage,
    formato: formato   // 'texto' = mensagem escrita · 'audio' = roteiro de fala
  };
}

// confirma o envio: marca a mensagem como usada, registra log e avança o contato
function registrarContato(c, resultado, msgBase, temaUsado, fechamentoUsado) {
  ensureJornada(c);
  if (msgBase && !c.msgHist.includes(msgBase)) c.msgHist.push(msgBase);
  // registra o fechamento usado para não repetir com este corretor
  if (fechamentoUsado) {
    c.fechHist = c.fechHist || [];
    if (!c.fechHist.includes(fechamentoUsado)) c.fechHist.push(fechamentoUsado);
  }
  c.contatoLog.push({
    date: now(),
    etapa: c.stage,
    contato: c.jornada.contato,
    tema: temaUsado || null,
    resultado: resultado // 'falei' | 'nao'
  });
  // avança o passo da jornada (não passa do total)
  const jornada = JORNADAS[c.stage] || [];
  if (c.jornada.contato < jornada.length) c.jornada.contato++;
  else c.jornada.contato = jornada.length + 1; // marca como concluída
  c.updatedAt = now();
}

// texto amigável do progresso da jornada
function jornadaLabel(c) {
  ensureJornada(c);
  const jornada = JORNADAS[c.stage] || [];
  if (c.jornada.contato > jornada.length) return 'Jornada concluída (' + jornada.length + '/' + jornada.length + ')';
  return 'Contato ' + c.jornada.contato + ' de ' + jornada.length;
}

const names = [];

/* ---------- datas ---------- */
function now() { return new Date().toISOString(); }
function todayStr() { return new Date().toDateString(); }
// número do dia no calendário LOCAL (antes usava UTC e errava depois das 21h em Brasília)
function dayNum(d) { const x = new Date(d); return Math.round(Date.UTC(x.getFullYear(), x.getMonth(), x.getDate()) / 86400000); }
// data local no formato AAAA-MM-DD (para campos de data e nomes de arquivo)
function isoLocal(d) {
  d = d || new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
// 'AAAA-MM-DD' puro é lido pelo navegador como UTC; força a leitura como data local
function parseData(v) { return new Date(/^\d{4}-\d{2}-\d{2}$/.test(v) ? v + 'T00:00:00' : v); }
const DOW = ['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
const MON = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
function dateLabel(d) {
  d = d || new Date();
  const dow = DOW[d.getDay()];
  return dow.charAt(0).toUpperCase() + dow.slice(1) + ', ' + d.getDate() + ' de ' + MON[d.getMonth()] + ' de ' + d.getFullYear();
}
function fmtDate(iso) {
  if (!iso) return '—';
  const d = parseData(iso);
  if (isNaN(d)) return '—';
  return String(d.getDate()).padStart(2,'0') + '/' + String(d.getMonth()+1).padStart(2,'0') + '/' + d.getFullYear();
}
function fmtDateTime(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return fmtDate(iso) + ' às ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}
function fmtMoney(v) { return (v || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL', minimumFractionDigits: 0, maximumFractionDigits: 0 }); }

/* ---------- modelo ---------- */
function newCorretor(id, name, stage) {
  const st = stage || 'sem_codigo';
  return {
    id, name, stage: st,
    star: false, moplan: false,
    status: 'pendente', missedYesterday: false,
    lastContact: null, lastResult: null,
    snoozeUntil: null,
    dados: { endereco: '', nascimento: '', cpf: '', telefone: '', producao: 0 },
    notas: [],
    jornada: { etapaAtual: st, contato: 1 },
    msgHist: [], fechHist: [], contatoLog: [], timing: null,
    createdAt: now(), updatedAt: now(), fieldUpdated: {},
    deleted: false, deletedAt: null, deleteReason: ''
  };
}

/* ---------- migração de dados antigos ---------- */
function migrateLegacy(saved) {
  // garante que todos os campos novos existam em dados vindos de versões anteriores
  // e conserta registros quebrados (um único card inválido não pode derrubar a tela)
  if (!Array.isArray(saved.corretores)) saved.corretores = [];
  saved.corretores = saved.corretores.filter(c => c && typeof c === 'object');
  const idsVistos = new Set();
  let maiorId = -1;
  saved.corretores.forEach(c => { if (Number.isInteger(c.id) && c.id > maiorId) maiorId = c.id; });
  saved.corretores.forEach(c => {
    if (!Number.isInteger(c.id) || idsVistos.has(c.id)) c.id = ++maiorId;   // id ausente ou repetido
    idsVistos.add(c.id);
    c.name = String(c.name == null || c.name === '' ? 'Sem nome' : c.name);
    if (stageIndex(c.stage) < 0) c.stage = 'sem_codigo';
    if (c.status !== 'falei' && c.status !== 'nao') c.status = 'pendente';
    if (c.dados && typeof c.dados === 'object') {
      ['endereco','nascimento','cpf','telefone'].forEach(k => { c.dados[k] = c.dados[k] == null ? '' : String(c.dados[k]); });
      c.dados.producao = parseFloat(c.dados.producao) || 0;
    } else c.dados = null;
    if (!Array.isArray(c.notas)) c.notas = [];
    if (!Array.isArray(c.msgHist)) c.msgHist = [];
    if (!Array.isArray(c.fechHist)) c.fechHist = [];
    if (!Array.isArray(c.contatoLog)) c.contatoLog = [];
    if (!c.fieldUpdated || typeof c.fieldUpdated !== 'object') c.fieldUpdated = {};
    if (c.jornada && !(c.jornada.contato >= 1)) c.jornada.contato = 1;
    if (c.star === undefined) c.star = false;
    if (c.moplan === undefined) c.moplan = false;
    if (c.snoozeUntil === undefined) c.snoozeUntil = null;
    if (c.deleted === undefined) c.deleted = false;
    if (c.deletedAt === undefined) c.deletedAt = null;
    if (c.deleteReason === undefined) c.deleteReason = '';
    if (!c.dados) c.dados = { endereco: '', nascimento: '', cpf: '', telefone: '', producao: 0 };
    if (c.dados.producao === undefined) c.dados.producao = 0;
    if (!c.notas) c.notas = [];
    if (!c.fieldUpdated) c.fieldUpdated = {};
    if (!c.createdAt) c.createdAt = now();
    if (!c.updatedAt) c.updatedAt = c.createdAt;
    if (!c.jornada) c.jornada = { etapaAtual: c.stage, contato: 1 };
    if (!c.msgHist) c.msgHist = [];
    if (!c.fechHist) c.fechHist = [];
    if (!c.contatoLog) c.contatoLog = [];
    if (c.timing === undefined) c.timing = null;
  });
  if (!Array.isArray(saved.history)) saved.history = [];
  if (!Number.isInteger(saved.nextId) || saved.nextId <= maiorId) saved.nextId = maiorId + 1;
  if (!saved.today || isNaN(new Date(saved.today))) saved.today = todayStr();
  return saved;
}

let recuperadoDaCopia = false;   // true quando o salvamento principal estava ilegível
function loadData() {
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(STORAGE)); } catch(e) {}
  if (saved && saved.corretores) {
    // guarda uma cópia do último estado bom (da sessão anterior) como rede de segurança
    try { localStorage.setItem(STORAGE + '_mirror', JSON.stringify({ savedAt: now(), data: saved })); } catch(e) {}
    return migrateLegacy(saved);
  }
  // salvamento principal ausente ou corrompido: tenta a cópia de segurança
  try {
    const mir = JSON.parse(localStorage.getItem(STORAGE + '_mirror'));
    if (mir && mir.data && mir.data.corretores && mir.data.corretores.length) { recuperadoDaCopia = true; return migrateLegacy(mir.data); }
  } catch(e) {}
  // tenta importar de uma versão anterior do sistema
  for (const k of LEGACY_KEYS) {
    try {
      const leg = JSON.parse(localStorage.getItem(k));
      if (leg && leg.corretores) return migrateLegacy(leg);
    } catch(e) {}
  }
  return {
    corretores: names.map((n, i) => newCorretor(i, n, 'solicitado')),
    today: todayStr(), nextId: names.length, history: []
  };
}

  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { el.innerHTML = '<i class="ti ti-circle-check-filled"></i><span>Salvo</span>'; }, 320);
}
let avisouErroSalvar = false;
let dirtySinceBackup = false;   // houve alteração desde o último backup baixado?
function gravarLocal() {
  try { localStorage.setItem(STORAGE, JSON.stringify(data)); return true; } catch(e) { return false; }
}
function saveData() {
  data.savedAt = now();

    flashSaved();

      avisouErroSalvar = true;
      alert('ATENÇÃO: não consegui salvar no navegador (armazenamento cheio ou bloqueado).\n\nSuas alterações continuam na tela, mas podem se perder ao fechar. Vá em Relatório → "Exportar backup completo" agora.');
    }
  }
  nuvemAgendar();
}

/* ---------- backup automático AO FECHAR A ABA ----------
   Liga/desliga pelo botão no topo (fica salvo). Quando ligado, ao fechar
   a aba/janela da carteira o sistema baixa UM backup atualizado direto na
   pasta de Downloads. Um arquivo por sessão, sem inundar a máquina. */
let autoBackupOn = false;
try { autoBackupOn = localStorage.getItem('w3g_autobackup') !== '0'; } catch(e) {}  // padrão LIGADO
let backupDoneThisClose = false;
function scheduleAutoBackup() { /* mantido por compatibilidade — não faz nada no modo "ao fechar" */ }
function doAutoBackup(silent) {
  try {
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const d = new Date();
    const stamp = isoLocal(d) + '_' + String(d.getHours()).padStart(2,'0') + 'h' + String(d.getMinutes()).padStart(2,'0');
    a.href = url; a.download = 'backup-carteira-w3g-' + stamp + '.json';
    a.click();
    URL.revokeObjectURL(url);
    dirtySinceBackup = false;
    if (!silent) {
      const el = document.getElementById('save-status');
      if (el) { el.innerHTML = '<i class="ti ti-download"></i><span>Backup baixado</span>'; setTimeout(() => { el.innerHTML = '<i class="ti ti-circle-check-filled"></i><span>Salvo</span>'; }, 1400); }
    }
  } catch(e) {}
}
// dispara o backup quando a aba está sendo fechada/escondida
function backupOnClose() {
  // sem alteração desde o último backup: não baixa arquivo repetido
  if (!autoBackupOn || backupDoneThisClose || !dirtySinceBackup) return;
  backupDoneThisClose = true;
  doAutoBackup(true);
  // se o usuário voltar para a aba (não fechou de fato), libera para um novo backup no próximo fechamento
  setTimeout(() => { backupDoneThisClose = false; }, 4000);
}
function toggleAutoBackup() {
  autoBackupOn = !autoBackupOn;
  try { localStorage.setItem('w3g_autobackup', autoBackupOn ? '1' : '0'); } catch(e) {}
  applyAutoBackupBtn();
  if (autoBackupOn) {
    alert('Backup automático ao fechar LIGADO.\n\nToda vez que você fechar a aba da carteira, o sistema baixa um arquivo de backup atualizado na sua pasta de Downloads.\n\nDica: no Chrome, em Configurações → Downloads, desligue "Perguntar onde salvar cada arquivo" para o backup cair direto na pasta, sem perguntar.');
  }
}
function applyAutoBackupBtn() {
  const b = document.getElementById('autobackup-btn');
  if (!b) return;
  b.style.color = autoBackupOn ? 'rgb(var(--c-accent))' : 'rgb(var(--c-muted))';
  b.title = autoBackupOn ? 'Backup ao fechar: LIGADO — clique para desligar' : 'Backup ao fechar: desligado — clique para ligar';
  const ic = b.querySelector('i');
  if (ic) ic.className = 'ti ' + (autoBackupOn ? 'ti-cloud-check' : 'ti-cloud-off');
}

let data = loadData();
let activeTab = 'dashboard';
let pipeFilter = 'todos', listSearch = '', followFilter = 'todos', followStage = 'todas', openCardId = null;
let repStart = null, repEnd = null, repFlag = 'todos';

/* ---------- helpers ---------- */
const ativos = () => data.corretores.filter(c => !c.deleted);
function initials(name) {
  const clean = name.replace(/[|\-].*$/, '').trim();
  const parts = clean.split(/\s+/).filter(Boolean);
  if (parts.length === 0) return '?';
  if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
  return (parts[0][0] + parts[1][0]).toUpperCase();
}
function shortName(name, n) { n = n || 24; return name.length > n ? name.slice(0, n - 2).trim() + '…' : name; }
function stageIndex(key) { return STAGES.findIndex(s => s.key === key); }
function stageOf(c) { return STAGES[stageIndex(c.stage)]; }
function isStar(c) { return c.star || (c.dados && c.dados.producao >= STAR_THRESHOLD); }
function isSnoozedOn(c, ref) { return !!c.snoozeUntil && dayNum(ref) < dayNum(c.snoozeUntil); }
function isSnoozed(c) { return isSnoozedOn(c, todayStr()); }

// o corretor era/é devido no dia `ref`? (mesma regra para hoje e para o fechamento do dia)
function isDueOn(c, ref) {
  if (c.deleted) return false;
  if (isSnoozedOn(c, ref)) return false;
  const st = stageOf(c);
  if (st.cadence === 'none') return false;
  // intervalo depende do número do contato atual (últimos contatos espaçam mais)
  ensureJornada(c);
  const intervalo = intervaloDoContato(c.stage, c.jornada.contato);
  if (intervalo <= 1) return true;         // diário nos primeiros contatos
  if (!c.lastContact) return true;          // nunca contatado nesta etapa: aparece
  return (dayNum(ref) - dayNum(c.lastContact)) >= intervalo;
}
function isDueToday(c) { return isDueOn(c, todayStr()); }
// já foi tratado HOJE (marcado Falei ou Não falei hoje)? Usado para manter o
// corretor visível no follow-up do dia mesmo depois de marcado — senão, numa
// etapa de 2 dias, ao marcar "Falei" o lastContact vira hoje e isDueToday passa
// a ser falso, fazendo ele sumir antes de aparecer no filtro "Falei".
function handledToday(c) {
  if (c.deleted || isSnoozed(c)) return false;
  if (stageOf(c).cadence === 'none') return false;
  if (c.status !== 'falei' && c.status !== 'nao') return false;
  // marcado hoje: lastContact = hoje (falei) OU updatedAt de hoje (não falei)
  if (c.lastContact && dayNum(c.lastContact) === dayNum(todayStr())) return true;
  if (c.status === 'nao' && c.updatedAt && dayNum(c.updatedAt) === dayNum(todayStr())) return true;
  return false;
}

/* ============================================================
   VIRADA DE DIA AUTOMÁTICA (meia-noite)
   ============================================================ */
// Resumo de um dia a partir do REGISTRO de contatos (fonte confiável): quem foi
// contatado conta como "falei" mesmo que, por causa da cadência, já não esteja
// mais "devido". Pendentes = quem era devido naquele dia e não foi tratado.
function resumoDoDia(ref) {
  const d = dayNum(ref);
  let done = 0, no = 0, pending = 0;
  data.corretores.forEach(c => {
    if (c.deleted) return;
    const log = (c.contatoLog || []).filter(x => dayNum(x.date) === d);
    if (log.some(x => x.resultado === 'falei')) done++;
    else if (log.some(x => x.resultado === 'nao')) no++;
    else if (isDueOn(c, ref)) pending++;
  });
  return { total: done + no + pending, done, no, pending };
}
function rolloverIfNeeded() {
  // modo nuvem: não vira o dia em cima da cópia local antes de saber o que há na nuvem
  if (nuvemLigada() && !nuvemPronta && !nuvemFalhou) return false;
  if (data.today === todayStr()) return false;
  const ref = data.today;
  if (!ref || isNaN(new Date(ref))) { data.today = todayStr(); saveData(); return true; }
  const util = ehDiaUtil(new Date(ref));
  const r = resumoDoDia(ref);
  // fim de semana/feriado só entra no histórico se houve contato de fato
  if (util || r.done || r.no) {
    data.history = data.history.filter(h => h.dateISO !== ref);
    data.history.unshift({ date: dateLabel(new Date(ref)), dateISO: ref, total: r.total, done: r.done, no: r.no, pending: r.pending });
    if (data.history.length > 120) data.history = data.history.slice(0, 120);
  }
  data.corretores.forEach(c => {
    // "sem contato no último dia útil": só quem ERA devido naquele dia e não foi contatado.
    // Fim de semana e feriado não mexem na marcação.
    if (util && !c.deleted && stageOf(c).cadence !== 'none') {
      c.missedYesterday = c.status !== 'falei' && isDueOn(c, ref);
    }
    c.status = 'pendente';
    delete c._undo;
  });
  data.today = todayStr();
  saveData();
  return true;
}
function scheduleMidnight() {
  const n = new Date();
  const next = new Date(n.getFullYear(), n.getMonth(), n.getDate() + 1, 0, 0, 8);
  setTimeout(() => { rolloverIfNeeded(); render(); scheduleMidnight(); }, next - n);
}

function moveStage(c, dir) {
  const idx = stageIndex(c.stage);
  const ni = idx + dir;
  if (ni < 0 || ni >= STAGES.length) return;
  const etapaAnterior = STAGES[idx];
  const etapaNova = STAGES[ni];
  // registra em que ponto da jornada da etapa atual o corretor estava ao mudar
  ensureJornada(c);
  const jornadaAnt = JORNADAS[etapaAnterior.key] || [];
  const pontoAnt = Math.min(c.jornada.contato, jornadaAnt.length);
  const totalAnt = jornadaAnt.length || 12;
  const rumo = dir > 0 ? 'avançou' : 'voltou';
  c.notas.unshift({
    date: now(),
    text: 'Etapa: ' + rumo + ' de "' + etapaAnterior.label + '" para "' + etapaNova.label + '" no contato ' + pontoAnt + ' de ' + totalAnt + '.',
    stage: etapaNova.key
  });
  c.stage = etapaNova.key;
  c.status = 'pendente';
  delete c._undo;   // mudou de etapa: o "desfazer" do contato de hoje deixa de valer
  // reinicia a jornada na nova etapa (contato 1)
  c.jornada = { etapaAtual: etapaNova.key, contato: 1 };
  c.updatedAt = now();
  saveData();
  if (dir > 0 && etapaNova.key === 'aberto') showCommunityAlert(c.name);
  render();
  if (openCardId === c.id) openCard(c.id);
}

      html += '<span>' + rotulo + (contato.temaSubstituido ? ' <span class="hint" style="font-size:10px; text-transform:none;">(tema do dia)</span>' : '') + '</span>';
      const fmtInfo = ehAudio ? { label: 'Áudio', icon: 'ti-microphone', cor: 'rgb(var(--c-dados))' }
                              : { label: 'Texto', icon: 'ti-brand-whatsapp', cor: 'rgb(var(--c-grow))' };
      html += '<span class="canal-badge" style="color:' + fmtInfo.cor + '; border-color:' + fmtInfo.cor + ';"><i class="ti ' + fmtInfo.icon + '"></i> ' + fmtInfo.label + '</span>';
      html += '</div>';
      if (ehAudio) html += '<div class="audio-hint"><i class="ti ti-player-record"></i> Grave um áudio no WhatsApp falando naturalmente o roteiro abaixo. Não precisa decorar — a ideia é soar como você.</div>';
      html += '<div class="jmsg' + (ehBreakup ? ' jmsg-breakup' : '') + (ehAudio ? ' jmsg-audio' : '') + '" id="msg-' + c.id + '">' + esc(contato.texto) + '</div>';
      html += '<div style="display:flex; gap:6px; margin-top:8px; flex-wrap:wrap;">';
      html += '<button class="btn btn-sm btn-accent" onclick="copiarMsg(' + c.id + ')"><i class="ti ti-copy"></i> ' + (ehAudio ? 'Copiar roteiro' : 'Copiar mensagem') + '</button>';
      html += '<button class="btn btn-sm" onclick="outraMsg(' + c.id + ')" title="Gerar outra variação"><i class="ti ti-refresh"></i> Outra</button>';
      if (c.dados.telefone) html += '<button class="btn btn-sm" onclick="abrirWhats(' + c.id + ')" title="' + (ehAudio ? 'Abrir conversa no WhatsApp para gravar o áudio' : 'Abrir conversa no WhatsApp com a mensagem') + '"><i class="ti ti-brand-whatsapp"></i> ' + (ehAudio ? 'Abrir conversa' : 'WhatsApp') + '</button>';
      html += '</div>';
      html += '</div>';
    }

    // timing / qualificação rápida
    html += '<div class="timing-row">';
    html += '<span class="hint" style="font-size:11px; margin-right:2px;">Timing:</span>';
    TIMINGS.forEach(tm => {
      const ativo = c.timing === tm.key;
      html += '<button class="timing-btn' + (ativo ? ' on' : '') + '" onclick="setTiming(' + c.id + ',\'' + tm.key + '\')" style="' + (ativo ? 'color:' + tm.cor + '; border-color:' + tm.cor + '; background:rgb(' + cssVarRGB(tm.cor) + ' / 0.12);' : '') + '"><i class="ti ' + tm.icon + '"></i> ' + tm.label + '</button>';
    });
    html += '</div>';

    // anotação + marcar contato
    html += '<div class="jcard-foot">';
    html += '<input type="text" placeholder="Anotação de hoje (opcional)..." value="' + esc(c._todayNote || '') + '" oninput="setTodayNote(' + c.id + ',this.value)" style="flex:1; min-width:120px;">';
    html += '<button class="btn btn-sm ' + (isDone ? 'btn-accent' : '') + '" onclick="markFalei(' + c.id + ')"><i class="ti ti-check"></i> Falei</button>';
    html += '<button class="btn btn-sm ' + (isNo ? 'btn-danger' : '') + '" onclick="markNao(' + c.id + ')"><i class="ti ti-x"></i> Não falei</button>';
    html += '</div>';

    html += '</div>';
  });
  if (items.length === 0) html += '<p class="empty">Nada para contatar com esse filtro. Bom trabalho!</p>';
  html += '</div>';

  html += '<p class="hint" style="margin-top:1rem;">Cada corretor tem sua jornada de 12 contatos por etapa, com mensagem sugerida diferente a cada toque (nunca repete para o mesmo corretor). Ao avançar de etapa, a jornada recomeça e o momento é registrado no histórico. Marcar "Falei" avança o contato da jornada.</p>';

  v.innerHTML = html;
}

/* ============================================================
   CARTEIRA (lista completa)
   ============================================================ */
function buildLista() {
  const v = document.getElementById('view');
  let html = '<div class="etiqueta">Base completa</div>';
  html += '<div style="display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:1.2rem;">';
  html += '<h2 class="section-title">Carteira de corretores</h2>';
  html += '<button class="btn btn-accent" onclick="addCorretor()"><i class="ti ti-plus"></i>Adicionar</button>';
  html += '</div>';

  html += '<div class="chips" style="margin-bottom:1rem;">';
  const semTel = ativos().filter(c => !c.dados.telefone).length;
  const filters = [['todos','Todos'], ...STAGES.map(s => [s.key, s.label]), ['star','★ Estrela'], ['moplan','⚓ Moplan'], ['sem_tel','Sem telefone (' + semTel + ')']];
  filters.forEach(f => {
    const cls = pipeFilter === f[0] ? (f[0]==='moplan' ? 'chip active-dados' : 'chip active') : 'chip';
    html += '<button class="' + cls + '" onclick="setListFilter(\'' + f[0] + '\')">' + f[1] + '</button>';
  });
  html += '</div>';

  html += '<div style="margin-bottom:1rem;"><input type="text" id="list-search" placeholder="Buscar corretor..." value="' + esc(listSearch) + '"></div>';

  let items = ativos();
  if (pipeFilter === 'star') items = items.filter(isStar);
  else if (pipeFilter === 'moplan') items = items.filter(c => c.moplan);
  else if (pipeFilter === 'sem_tel') items = items.filter(c => !c.dados.telefone);
  else if (pipeFilter !== 'todos') items = items.filter(c => c.stage === pipeFilter);
  if (listSearch) items = items.filter(c => c.name.toLowerCase().includes(listSearch.toLowerCase()));

  html += '<div class="list" style="max-height:none;">';
  items.forEach(c => {
    const idx = stageIndex(c.stage);
    const st = stageOf(c);
    html += '<div class="row' + (isStar(c) ? ' star' : '') + (c.moplan ? ' moplan' : '') + '">';
    // flags
    html += '<div style="display:flex; flex-direction:column; gap:2px;">';
    html += '<button class="flag-btn ' + (c.star ? 'star-on' : (isStar(c) ? 'star-on' : '')) + '" onclick="toggleStar(' + c.id + ')" title="Corretor estrela"><i class="ti ' + (isStar(c) ? 'ti-star-filled' : 'ti-star') + '"></i></button>';
    html += '<button class="flag-btn ' + (c.moplan ? 'moplan-on' : '') + '" onclick="toggleMoplan(' + c.id + ')" title="Indicação Moplan"><i class="ti ' + (c.moplan ? 'ti-anchor' : 'ti-anchor') + '"></i></button>';
    html += '</div>';
    html += avatarHTML(c);
    html += '<button class="name-btn" onclick="openCard(' + c.id + ')"><div class="nm">' + esc(c.name);
    if (isSnoozed(c)) html += ' <span class="pill" style="background:rgb(var(--c-dados) / 0.12); color:rgb(var(--c-dados));">soneca</span>';
    html += '</div><div class="row-flags">' + stageBadge(st);
    if (c.moplan) html += '<span class="pill" style="background:rgb(var(--c-dados) / 0.12); color:rgb(var(--c-dados));">Moplan</span>';
    html += '</div></button>';
    html += '<button class="btn btn-icon btn-ghost" onclick="moveById(' + c.id + ',-1)" ' + (idx === 0 ? 'disabled' : '') + ' title="Voltar etapa"><i class="ti ti-arrow-left"></i></button>';
    if (st.next) html += '<button class="btn btn-sm" onclick="moveById(' + c.id + ',1)">' + st.next + ' <i class="ti ti-arrow-right"></i></button>';
    else html += '<button class="btn btn-sm" disabled><i class="ti ti-check"></i>Engajado</button>';
    html += '<button class="btn btn-icon btn-danger" onclick="trashCorretor(' + c.id + ')" title="Mover para lixeira"><i class="ti ti-x"></i></button>';
    html += '</div>';
  });
  if (items.length === 0) html += '<p class="empty">Nenhum corretor aqui.</p>';
  html += '</div>';
  v.innerHTML = html;

  const ls = document.getElementById('list-search');
  if (ls) ls.oninput = (e) => { listSearch = e.target.value; const pos = e.target.selectionStart; buildLista(); refocar('list-search', pos); };
}
// a tela é redesenhada a cada letra da busca; devolve o cursor ao campo
function refocar(id, pos) {
  const el = document.getElementById(id);
  if (!el) return;
  el.focus();
  try { el.setSelectionRange(pos, pos); } catch(e) {}
}

/* ============================================================
   LIXEIRA
   ============================================================ */
function buildLixeira() {
  const v = document.getElementById('view');
  const trashed = data.corretores.filter(c => c.deleted).sort((a,b) => new Date(b.deletedAt) - new Date(a.deletedAt));
  let html = '<div class="etiqueta">Saíram da carteira</div>';
  html += '<h2 class="section-title" style="margin-bottom:0.5rem;">Lixeira</h2>';
  html += '<p class="hint" style="margin:0 0 1.3rem;">Corretores sem contato possível ou removidos. Ficam aqui para controle — você pode restaurar ou excluir definitivamente.</p>';

  if (trashed.length === 0) {
    html += '<div class="card"><p class="empty"><i class="ti ti-trash-off" style="font-size:28px; display:block; margin-bottom:8px; opacity:0.5;"></i>Lixeira vazia.</p></div>';
  } else {
    html += '<div class="list" style="max-height:none;">';
    trashed.forEach(c => {
      const st = stageOf(c);
      html += '<div class="row">';
      html += avatarHTML(c);
      html += '<div style="flex:1; min-width:0;"><div class="nm">' + esc(c.name) + '</div>';
      html += '<div class="hint" style="margin-top:3px;">Saiu em ' + fmtDate(c.deletedAt) + (c.deleteReason ? ' · ' + esc(c.deleteReason) : '') + ' · estava em ' + st.label + '</div></div>';
      html += '<button class="btn btn-sm" onclick="restoreCorretor(' + c.id + ')"><i class="ti ti-arrow-back-up"></i>Restaurar</button>';
      html += '<button class="btn btn-icon btn-danger" onclick="purgeCorretor(' + c.id + ')" title="Excluir definitivamente"><i class="ti ti-trash"></i></button>';
      html += '</div>';
    });
    html += '</div>';
  }
  v.innerHTML = html;
}
/* ============================================================
   CARD DO CORRETOR
   ============================================================ */
function openCard(id) {
  openCardId = id;
  const c = data.corretores.find(x => x.id === id);
  if (!c) return;
  const ex = document.querySelector('.overlay');
  if (ex) ex.remove();

  const star = isStar(c);
  const st = stageOf(c);

  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.onclick = (e) => { if (e.target === overlay) { overlay.remove(); openCardId = null; } };

  let h = '<div class="modal">';
  h += '<div class="modal-head' + (star ? ' star' : '') + '">';
  h += '<button class="modal-close" id="mc">&times;</button>';
  h += '<div class="mh-title">' + esc(c.name);
  if (star) h += ' <i class="ti ti-star-filled" style="font-size:18px;"></i>';
  if (c.moplan) h += ' <i class="ti ti-anchor" style="font-size:16px;"></i>';
  h += '</div>';
  h += '<div class="mh-sub">' + st.label + ' · ' + (star ? 'Corretor estrela' : 'Produção ' + fmtMoney(c.dados.producao));
  if (isSnoozed(c)) h += ' · <span style="display:inline-flex; align-items:center; gap:3px;"><i class="ti ti-zzz"></i>soneca até ' + fmtDate(c.snoozeUntil) + '</span>';
  h += '</div></div>';

  h += '<div class="modal-body">';

  // flags + soneca actions
  h += '<div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:1.2rem;">';
  h += '<button class="btn btn-sm ' + (star ? 'btn-accent' : '') + '" onclick="toggleStar(' + c.id + ');refreshCard()"><i class="ti ' + (star ? 'ti-star-filled' : 'ti-star') + '"></i>' + (star ? 'Estrela' : 'Marcar estrela') + '</button>';
  h += '<button class="btn btn-sm" style="' + (c.moplan ? 'border-color:rgb(var(--c-dados) / 0.5); color:rgb(var(--c-dados)); background:rgb(var(--c-dados) / 0.12);' : '') + '" onclick="toggleMoplan(' + c.id + ');refreshCard()"><i class="ti ti-anchor"></i>' + (c.moplan ? 'Moplan' : 'Marcar Moplan') + '</button>';
  if (isSnoozed(c)) h += '<button class="btn btn-sm" onclick="wakeUp(' + c.id + ')"><i class="ti ti-bell"></i>Tirar da soneca</button>';
  else h += '<button class="btn btn-sm" onclick="snoozeCard(' + c.id + ')"><i class="ti ti-zzz"></i>Soneca até data</button>';
  h += '<button class="btn btn-sm" onclick="gerarReativacao(' + c.id + ')" title="Mensagem para reaproximar um corretor parado há muito tempo"><i class="ti ti-refresh-dot"></i>Reativar</button>';
  h += '</div>';

  // mover etapa (funil)
  const cIdx = stageIndex(c.stage);
  h += '<div class="sect-title"><i class="ti ti-arrows-split"></i>Etapa no funil</div>';
  h += '<div style="display:flex; align-items:center; gap:10px; margin-bottom:1.2rem; padding:12px 14px; background:rgb(var(--c-paper) / 0.5); border:1px solid rgb(var(--c-line)); border-radius:12px;">';
  h += '<button class="btn btn-icon" onclick="moveById(' + c.id + ',-1)" ' + (cIdx === 0 ? 'disabled' : '') + ' title="Voltar etapa"><i class="ti ti-arrow-left" style="font-size:16px;"></i></button>';
  h += '<div style="flex:1; text-align:center;"><div style="margin-bottom:3px;">' + stageBadge(st) + '</div>';
  h += '<div class="hint" style="font-size:11px;">' + (st.next ? 'Próxima: ' + st.next : 'Etapa final') + '</div></div>';
  if (st.next) h += '<button class="btn btn-sm btn-accent" onclick="moveById(' + c.id + ',1)">' + st.next + ' <i class="ti ti-arrow-right"></i></button>';
  else h += '<button class="btn btn-icon" disabled title="Etapa final"><i class="ti ti-check" style="font-size:16px;"></i></button>';
  h += '</div>';

  // dados
  h += '<div class="sect-title"><i class="ti ti-id"></i>Dados cadastrais</div>';
  h += '<div class="field-grid">';
  h += cardField(c, 'Nome', 'name', 'text', true, false);
  h += cardField(c, 'Telefone', 'telefone', 'tel', false, true);
  h += cardField(c, 'Data de nascimento', 'nascimento', 'text', false, true);
  h += cardField(c, 'CPF', 'cpf', 'text', false, true);
  h += cardField(c, 'Produção mensal (R$)', 'producao', 'number', false, true);
  h += cardField(c, 'Endereço', 'endereco', 'text', true, true);
  h += '</div>';

  // datas
  h += '<div class="info-box">';
  h += '<div><div class="field-meta" style="margin:0;">Card criado em</div><div style="font-size:13px; font-weight:600; margin-top:2px;">' + fmtDateTime(c.createdAt) + '</div></div>';
  h += '<div><div class="field-meta" style="margin:0;">Última atualização</div><div style="font-size:13px; font-weight:600; margin-top:2px;">' + fmtDateTime(c.updatedAt) + '</div></div>';
  h += '</div>';

  h += '<hr class="modal-divider">';

  // anotações
  h += '<div class="sect-title"><i class="ti ti-notes"></i>Histórico de anotações <span class="hint" style="font-weight:400; text-transform:none; letter-spacing:0;">(' + c.notas.length + ')</span></div>';
  h += '<div style="margin-bottom:1rem;">';
  h += '<textarea id="new-note" placeholder="Nova anotação sobre este corretor..." style="margin-bottom:7px;"></textarea>';
  h += '<button class="btn btn-sm btn-accent" onclick="addNote(' + c.id + ')"><i class="ti ti-plus"></i>Adicionar anotação</button>';
  h += '</div>';

  if (c.notas.length === 0) {
    h += '<p class="hint" style="text-align:center; padding:1rem;">Nenhuma anotação ainda. As do follow-up também aparecem aqui.</p>';
  } else {
    c.notas.forEach((nt, i) => {
      const ns = STAGES[stageIndex(nt.stage)] || STAGES[0];
      h += '<div class="note-item">';
      h += '<div class="note-date"><i class="ti ti-clock" style="font-size:11px;"></i>' + fmtDateTime(nt.date) + ' · ' + stageBadge(ns) + '</div>';
      h += '<div class="note-text">' + esc(nt.text) + '</div>';
      h += '<button class="btn btn-sm btn-ghost" style="margin-top:6px; padding:3px 8px; color:rgb(var(--c-alert));" onclick="delNote(' + c.id + ',' + i + ')"><i class="ti ti-trash" style="font-size:12px;"></i> Remover</button>';
      h += '</div>';
    });
  }

  h += '</div></div>';
  overlay.innerHTML = h;
  document.body.appendChild(overlay);
  document.getElementById('mc').onclick = () => { overlay.remove(); openCardId = null; };
}
function cardField(c, label, key, type, full, isDado) {
  const val = isDado ? c.dados[key] : c[key];
  let display = val || '';
  if (type === 'number') display = (val && val !== 0) ? val : '';
  const meta = c.fieldUpdated[key] ? 'Atualizado ' + fmtDateTime(c.fieldUpdated[key]) : 'Não preenchido';
  return '<div class="' + (full ? 'full' : '') + '">' +
    '<label>' + label + '</label>' +
    '<input type="' + type + '" value="' + esc(String(display)) + '" placeholder="' + label + '" oninput="updateField(' + c.id + ',\'' + key + '\',' + isDado + ',this.value)">' +
    '<div class="field-meta" id="meta-' + key + '">' + meta + '</div></div>';
}
function refreshCard() { if (openCardId !== null) openCard(openCardId); }

/* ============================================================
   RELATÓRIO
   ============================================================ */
function buildRelatorio() {
  const v = document.getElementById('view');
  let html = '<div class="etiqueta">Exportação & compliance</div>';
  html += '<h2 class="section-title" style="margin-bottom:1.3rem;">Relatórios</h2>';

  // backup

  html += '<div class="sect-title"><i class="ti ti-shield-lock"></i>Backup de segurança</div>';
  html += '<p class="hint" style="margin:0 0 0.9rem;">Exporte de tempos em tempos. Se trocar de computador ou limpar o navegador, restaure por aqui. Faça isso toda sexta junto com o relatório.</p>';
  html += '<div style="display:flex; gap:8px; flex-wrap:wrap;">';
  html += '<button class="btn btn-accent btn-sm" onclick="exportBackup()"><i class="ti ti-download"></i>Exportar backup completo</button>';
  html += '<button class="btn btn-sm" onclick="importBackup()"><i class="ti ti-upload"></i>Restaurar backup</button>';

  html += '<p class="hint" style="margin:0 0 1rem;">O que foi feito no intervalo escolhido abaixo: contatos marcados no follow-up e mudanças de etapa. ' + (repStart || repEnd ? '' : 'Sem período selecionado, mostra tudo.') + '</p>';
